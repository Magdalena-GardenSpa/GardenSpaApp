<style>

    --green:#1b5e20; --green-d:#0f3d13; --green-l:#e8f3e9;

  *{box-sizing:border-box;margin:0;padding:0}

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;
const BUILD = "2026-08-02-a";

/* ============ KONFIGURACJA SUPABASE ============
   Jednorazowo uruchom SQL ze skryptu na końcu tego pliku (w komentarzu) w
   Supabase → SQL Editor, żeby utworzyć potrzebne tabele. Podmień dane poniżej
   swoim URL i kluczem "anon"/"publishable" z Project Settings → API.
*/
const SUPABASE_URL = "https://vgnkrgrmdauwzugskxsc.supabase.co";
const SUPABASE_KEY = "sb_publishable_o_gCTwEbzh2WAen3toyM6A_ttk4i95B";
const H = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };

async function sbGet(table, query=""){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {headers:H});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbInsert(table, row){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {method:"POST", headers:{...H,"Prefer":"return=representation"}, body:JSON.stringify(row)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpdate(table, idCol, idVal, patch){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${idCol}=eq.${idVal}`, {method:"PATCH", headers:{...H,"Prefer":"return=representation"}, body:JSON.stringify(patch)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table, idVal){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${idVal}`, {method:"DELETE", headers:H});
  if(!r.ok) throw new Error(await r.text());
}

const fmt = n => (Number(n)||0).toLocaleString("pl-PL",{maximumFractionDigits:0}) + " zł";
const MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const WEEKDAYS = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
const COLOR_SWATCHES = ['#153826','#3a6350','#c9a227','#8a5a3b','#5b4b8a','#2f6f8f','#a13d3d'];
const LOGO = "https://ugc.production.linktr.ee/dce7fc8e-f896-412b-b1b8-4a47ce1d35e5_1000001073.jpeg";

function cityOnly(v){
  if(!v) return "";
  let s = String(v).split(",").pop().trim();
  s = s.replace(/\d{2}-\d{3}\s*/,"").trim();
  s = s.split(/\s+(?:wjazd|obok|przy|za|k\.|kolo|koło)\b/i)[0].trim();
  const kw = s.search(/\b(ul\.|ulica|al\.|aleja|os\.|osiedle)\b/i);
  if(kw>0) s = s.slice(0,kw).trim();
  else s = s.replace(/^(ul\.|ulica|al\.|aleja|os\.|osiedle)\s*/i,"").trim();
  const m = s.match(/\d+[a-zA-Z]?(\/\d+[a-zA-Z]?)?(?!.*\d)/);
  if(m){ const after = s.slice(m.index+m[0].length).trim(); if(after) s = after; else { s = s.slice(0,m.index).replace(/\s*(ul\.|ulica|al\.|os\.)\s*$/i,"").trim(); } }
  return s.replace(/^(ul\.|ulica|al\.|os\.)\s*/i,"").trim();
}

function hasEnded(o){
  if(!o) return false;
  const t=new Date(); const tN=t.getFullYear()*10000+t.getMonth()*100+t.getDate();
  const e=new Date(o.year,o.month,o.day+(o.days||1));
  return (e.getFullYear()*10000+e.getMonth()*100+e.getDate()) < tN;
}

function isInProgress(o){
  if(!o || o.status==="draft" || o.status==="done") return false;
  const t=new Date(); const tN=t.getFullYear()*10000+t.getMonth()*100+t.getDate();
  const s=o.year*10000+o.month*100+o.day;
  const e=new Date(o.year,o.month,o.day+(o.days||1));
  return s<=tN && tN<=(e.getFullYear()*10000+e.getMonth()*100+e.getDate());
}

function referralCode(client){
  if(typeof client==='object' && client) return client.referral_code || 'GS'+String(client.phone||'').replace(/\D/g,'').slice(-4);
  return 'GS'+String(client||'').replace(/\D/g,'').slice(-4);
}
function referralMsg(client,settings){
  const tpl = settings.referral_msg_template || '🌿 GardenSpa — Twój kod polecenia: {kod}\n\nPoleć nas znajomym! Gdy skorzystają z wynajmu i podadzą ten kod, Ty otrzymasz {procent}% rabatu na kolejny wynajem 🛁🔥';
  return tpl.replaceAll('{kod}', client.referral_code||referralCode(client)).replaceAll('{procent}', settings.referral_pct||15);
}
function waPhone(p){ const d=String(p||'').replace(/\D/g,''); return d.startsWith('48')?d:'48'+d; }
function displayName(phone, name){ return name ? name : phone + ' (brak imienia)'; }
function isVoucherExpired(v){ if(!v) return false; const today=new Date(); const u=new Date(v.valid_until); return u < today; }
function isVoucherUsable(v){ return v && !v.redeemed && !isVoucherExpired(v); }
function voucherStatus(v){ if(v.redeemed) return {label:"Wykorzystany",cls:"b-grey"}; if(isVoucherExpired(v)) return {label:"Wygasły",cls:"b-red"}; if(v.linked_offer_id) return {label:"Termin ustalony",cls:"b-blue"}; return {label:"Aktywny",cls:"b-green"}; }
function paymentLabel(p){ return p==="paid_full"?"Opłacony w całości":p==="deposit"?"Zadatek wpłacony":"Nieopłacony"; }
function dateRangeLabel(o){
  const start = new Date(o.year, o.month, o.day);
  const days = o.days||1;
  const end = new Date(o.year, o.month, o.day + days);
  const sameMonth = start.getMonth()===end.getMonth() && start.getFullYear()===end.getFullYear();
  if(sameMonth) return `${start.getDate()}-${end.getDate()}.${o.month+1}.${o.year}`;
  return `${start.getDate()}.${start.getMonth()+1} - ${end.getDate()}.${end.getMonth()+1}.${end.getFullYear()}`;
}

/* Tworzy migawkę cen sprzętu i ustawień dla oferty — zamrażaną w momencie zapisu.
   Chroni ofertę przed przeliczeniem gdy zmienią się ceny w ustawieniach. */
function buildRateSnapshot(offer, equipment, settings){
  const ids = [offer.equipment_id, ...(offer.extra_equip_ids||[])].filter(Boolean);
  const rates = {};
  const priceFields = ['rate_day','rate_day_weekend','rate_extra_day','rate_extra_day_weekend','rate_weekend','rate_weekend3','rate_week','deposit'];
  ids.forEach(id=>{
    const e = equipment.find(x=>x.id===id);
    if(e){
      const snap = {};
      priceFields.forEach(f=>{ if(e[f]!==undefined) snap[f]=e[f]; });
      rates[id] = snap;
    }
  });
  const s = settings || {};
  return {
    frozen_rates: rates,
    frozen_settings: {
      free_km: s.free_km, km_rate: s.km_rate, zadatek: s.zadatek,
      referral_discount_type: s.referral_discount_type, referral_discount_value: s.referral_discount_value
    }
  };
}

function computeCalc(f, equipment, settings, packages, clients, vouchers){
  // ZAMROŻONE CENY: jeśli oferta ma snapshot z chwili zapisu, używaj go zamiast bieżącego cennika.
  // Dzięki temu zmiana cen w Ustawieniach NIGDY nie zmienia ofert już zapisanych — chroni kwotę,
  // którą klient dostał. Ceny odświeżają się tylko przy manualnej edycji oferty.
  if(f.frozen_rates && typeof f.frozen_rates === 'object'){
    const frozenIds = Object.keys(f.frozen_rates);
    if(frozenIds.length > 0){
      const virtualEquipment = frozenIds.map(id => {
        const bieżący = equipment.find(e=>e.id===id);
        return { ...(bieżący||{}), ...f.frozen_rates[id], id };
      });
      // Sklej: zamrożone pierwsze, reszta z bieżącego (dla ewentualnych brakujących)
      equipment = [...virtualEquipment, ...equipment.filter(e=>!frozenIds.includes(e.id))];
    }
  }
  if(f.frozen_settings && typeof f.frozen_settings === 'object'){
    settings = { ...settings, ...f.frozen_settings };
  }
  const eq = equipment.find(e=>e.id===f.equipment_id) || equipment[0] || {};
  const startDow = new Date(f.year, f.month, f.day).getDay();
  const startIsWeekend = startDow===5 || startDow===6 || startDow===0;
  const rateOf = (e) => {
    if(f.mode==='weekend') return (qtyOf()>=3 ? (+e.rate_weekend3||+e.rate_weekend||0) : (+e.rate_weekend||0));
    if(f.mode==='week') return +e.rate_week||0;
    return startIsWeekend ? (+e.rate_day_weekend||+e.rate_day||0) : (+e.rate_day||0);
  };
  const extraDayRate = (e, dayIdx) => {
    const d = new Date(f.year, f.month, f.day+dayIdx).getDay();
    const isW = d===5||d===6||d===0;
    return isW ? (+e.rate_extra_day_weekend||+e.rate_extra_day||+e.rate_day||0) : (+e.rate_extra_day||+e.rate_day||0);
  };
  const extraEquip = (f.extra_equip_ids||[]).map(id=>equipment.find(e=>e.id===id)).filter(Boolean);
  const qtyOf = () => +(f.days ?? f.qty) || 1;
  const daysRental = (e) => { const q=qtyOf(); if(f.mode!=='day') return rateOf(e); if(q<=1) return rateOf(e); let s=rateOf(e); for(let i=1;i<q;i++) s+=extraDayRate(e,i); return s; };
  let rentalBase, extraRental;
  if(f.rate_override!=null && +f.rate_override>0){ rentalBase = +f.rate_override; extraRental = 0; }
  else { rentalBase = daysRental(eq); extraRental = extraEquip.reduce((s,e)=>s+daysRental(e),0); }
  const freeKm = (+settings.free_km||0) * 4, kmRate = +settings.km_rate||0;
  const kmTotal = (+f.km||0) * 4;
  const billKm = Math.max(0, kmTotal - freeKm);
  const transport = (f.transport_override!=null && +f.transport_override>0) ? +f.transport_override : billKm*kmRate;
  const addonsSum = (f.addon_ids||[]).reduce((s,id)=>{ const p=packages.find(x=>x.id===id); return s+(p?+p.price||0:0); },0);
  const customSum = (f.custom_items||[]).reduce((s,c)=>s+(+c.price||0),0);
  const depositAuto = (+eq.deposit||0) + extraEquip.reduce((s,e)=>s+(+e.deposit||0),0);
  const deposit = (f.deposit_override!=null && +f.deposit_override>0) ? +f.deposit_override : depositAuto;
  const zad = (f.zadatek_override!=null && +f.zadatek_override>0) ? +f.zadatek_override : (+settings.zadatek||0);
  const client = clients.find(c=>c.phone===f.phone);
  const clientDiscType = client?.referral_discount_type || 'percent';
  const clientDiscValue = client?.referral_discount_value || client?.referral_pct_pending || 0;
  const discExpired = client?.referral_valid_until && new Date(client.referral_valid_until) < new Date(new Date().toDateString());
  const applyDiscount = f.apply_client_discount!==false && clientDiscValue>0 && !discExpired;
  const discountType = f.discount_type_override || clientDiscType;
  const discountValue = (f.discount_value_override!=null && f.discount_value_override!=='') ? +f.discount_value_override : clientDiscValue;
  const discountAmt = applyDiscount ? (discountType==='amount' ? Math.min(discountValue, rentalBase+extraRental) : Math.round((rentalBase+extraRental) * discountValue / 100)) : 0;
  const discountPct = discountType==='percent' ? discountValue : 0;
  const rentalAfterReferral = rentalBase + extraRental - discountAmt;
  const voucher = (vouchers||[]).find(v=>v.code === String(f.voucher_code||'').trim().toUpperCase());
  const voucherUsable = isVoucherUsable(voucher);
  const preVoucherTotal = rentalAfterReferral + transport + addonsSum + customSum + deposit;
  const voucherAmt = voucherUsable ? Math.min(+voucher.value||0, rentalAfterReferral+transport+addonsSum+customSum) : 0;
  const total = preVoucherTotal - voucherAmt;
  const offerCost = +f.offer_cost||0;
  return { rental: rentalAfterReferral, extraEquip, discountAmt, discountPct, discountType, discExpired, applyDiscount, clientDiscValue, transport, addonsSum, customSum, deposit, zadatek: zad, total, billKm, kmTotal, voucher, voucherUsable, voucherAmt, offerCost, eq };
}

function computeExpiry(settings){
  const mode = settings.offer_valid_mode||'hours';
  if(mode==='until_date' && settings.offer_valid_date) return new Date(settings.offer_valid_date+'T23:59:59').toISOString();
  const val = +settings.offer_valid_value||48;
  const ms = mode==='days' ? val*86400000 : val*3600000;
  return new Date(Date.now()+ms).toISOString();
}

function dobaForm(n){ const t=n%10, h=n%100; if(n===1) return 'doba'; if(t>=2&&t<=4&&!(h>=12&&h<=14)) return 'doby'; return 'dób'; }

function tierLabel(tiers, mode, qty){
  const t = (tiers||[]).find(x=>x.mode===mode);
  if(mode==='weekend') return (t?t.title:'Weekend')+` — ${qty>=3?3:2} doby`;
  if(t && (mode!=='day' || qty===1)) return t.title;
  if(mode==='day') return `${qty} ${dobaForm(qty)} relaksu`;
  return 'Wynajem';
}

function reviewDraftOptions(name, city, equipName, equipType, addonNames, voucherUsed){
  if(!equipName) return [];
  const firstName = name ? String(name).trim().split(/\s+/)[0] : '';
  const who = firstName || 'My';
  const miejsce = city ? ` z ${cityOnly(city)}` : '';
  const co = equipName || 'sprzęt';
  const typSlowo = equipType==='sauna' ? 'sauny' : equipType==='balia' ? 'balii' : 'sprzętu';
  const relaksSlowo = equipType==='sauna' ? 'porządne wygrzanie' : equipType==='balia' ? 'kąpiel pod chmurką' : 'relaks';
  const extra = addonNames && addonNames.length ? ` Skorzystaliśmy też z: ${addonNames.join(', ')}.` : '';
  const voucherLine = voucherUsed ? ' Korzystaliśmy z vouchera podarunkowego — świetny prezent, polecamy dla bliskich!' : '';
  const pool = [
    `${who}${miejsce} — polecam! Wynajęliśmy ${co} od GardenSpa. Świetna organizacja, czysto i profesjonalnie.${extra}${voucherLine}`,
    `GardenSpa — mobilny wynajem ${typSlowo}${miejsce}: ${co}. Strzał w dziesiątkę na ${relaksSlowo}, zdecydowanie polecam każdemu, kto szuka relaksu blisko domu.${extra}`,
    `Szukaliśmy oferty${miejsce} i trafiliśmy na GardenSpa — ${co}: punktualność, czystość i mega klimat. Na pewno wrócimy!${voucherLine}`,
    `Wszystko dowiezione na czas${miejsce}, ${co} w idealnym stanie. Super sposób na ${relaksSlowo} bez wyjazdu.${extra}`,
    `Nie spodziewaliśmy się takiego komfortu${miejsce}! GardenSpa i ${co} — pełen profesjonalizm od pierwszego kontaktu do odbioru.${voucherLine}`,
    `${co} od GardenSpa${miejsce} to była świetna decyzja — łatwa rezerwacja, miła obsługa, zero stresu.${extra} Chętnie polecimy znajomym.`,
    `Jeśli szukacie ${typSlowo}${miejsce} — GardenSpa i ${co} zdały egzamin na piątkę. Wracamy przy pierwszej okazji.${voucherLine}`,
  ];
  return pool.map(t=>({t,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.t).slice(0,3);
}

function offerMsg(o, name, settings, equipment, packages, tiers, clients, vouchers){
  const eq = equipment.find(e=>e.id===o.equipment_id) || {};
  const calc = computeCalc(o, equipment, settings, packages, clients||[], vouchers||[]);
  let addonNames = (o.addon_ids||[]).filter(id=>id!=='p1' && id!=='p7').map(id=>(packages.find(p=>p.id===id)||{}).name).filter(Boolean);
  const greet = (()=>{ const cli = (clients||[]).find(c=>c.phone===o.phone); const isCompany = cli && cli.client_type==='company'; if(isCompany || !name) return 'Dzień dobry,'; const first = String(name).trim().split(/\s+/)[0]; return first ? `Dzień dobry ${first},` : 'Dzień dobry,'; })();
  const useTier = o.use_tier !== false;
  const tierData = useTier ? ((tiers||[]).find(t=>t.mode===o.mode) || {}) : {};
  const tier = tierLabel(tiers, o.mode, +(o.days ?? o.qty) || 1);
  let extras = useTier ? (tierData.perks || 'W prezencie od nas: pierwszy worek drewna na rozpalenie 🔥 i światełka na klimat ✨') : '';
  const norm = s => String(s||'').toLowerCase().replace(/[^a-ząćęłńóśźż ]+/g,' ');
  const extrasNorm = norm(extras);
  addonNames = addonNames.filter(n=>{
    const words = norm(n).split(/\s+/).filter(w=>w.length>4);
    return !words.some(w=>extrasNorm.includes(w));
  });
  if(addonNames.length) extras = extras ? extras + ', a do tego: ' + addonNames.join(', ') : 'W cenie: ' + addonNames.join(', ');
  let nudge = useTier && tierData.show_upsell && tierData.upsell_text ? ` ${tierData.upsell_text}` : '';
  const extraNames = (calc.extraEquip||[]).map(e=>e.name);
  const setLine = extraNames.length ? ` + zestaw z: ${extraNames.join(', ')}` : '';
  const customNames = (o.custom_items||[]).filter(c=>c.label).map(c=>`${c.label} (${fmt(c.price)})`);
  const customLine = customNames.length ? `\nDodatkowe ustalenia: ${customNames.join(', ')}.` : '';
  const payableNow = calc.total - calc.deposit;
  const hasOverride = o.rate_override!=null && o.rate_override!=='';
  const altLines = hasOverride ? [] : (o.alt_options||[]).map(a=>{
    const c2 = computeCalc({...o, mode:a.mode, days:a.qty||1, qty:a.qty||1}, equipment, settings, packages, clients||[], vouchers||[]);
    return `• ${tierLabel(tiers, a.mode, a.qty||1)}: ${fmt(c2.total - c2.deposit)}`;
  });
  const altBlock = altLines.length ? `\n\nInne opcje do wyboru:\n${altLines.join('\n')}` : '';
  if(nudge) nudge = '\n' + nudge.trimStart();
  const nights = +(o.days ?? o.qty) || 1;
  const headLine = (useTier ? `${eq.name}${setLine} — ${tier}` : `${eq.name}${setLine} — ${nights} ${dobaForm(nights)}`).replace(/\s+/g,' ').replace(/\s+—/,' —');
  const extrasLine = extras ? `\n${extras}.` : '';
  const zadShown = Math.min(calc.zadatek, payableNow);
  const zadClause = zadShown>0 ? (zadShown<payableNow ? ` (w tym zadatek ${fmt(zadShown)} przy rezerwacji)` : ` — płatne przy rezerwacji`) : '';
  const dateLine = `\n📅 Termin: ${dateRangeLabel(o)} (godziny przywiezienia i odbioru ustalamy indywidualnie)`;
  let expDate = o.expires_at ? new Date(o.expires_at) : null;
  if(!expDate || expDate < new Date()) expDate = settings ? new Date(computeExpiry(settings)) : null;
  const validLine = expDate ? `\n⏳ Oferta ważna do ${expDate.getDate()}.${expDate.getMonth()+1}.${expDate.getFullYear()}, godz. ${String(expDate.getHours()).padStart(2,'0')}:${String(expDate.getMinutes()).padStart(2,'0')}.` : '';
  const breakdown = [
    `• Wynajem: ${fmt(calc.rental - calc.discountAmt - calc.voucherAmt)}`,
    calc.transport>0 ? `• Transport (dojazd i odbiór): ${fmt(calc.transport)}` : `• Transport: w cenie`,
    (calc.addonsSum + calc.customSum)>0 ? `• Dodatki: ${fmt(calc.addonsSum + calc.customSum)}` : null,
  ].filter(Boolean).join('\n');
  const woodPkg = (packages||[]).filter(p=>/drewn/i.test(p.name||'') && +p.price>0)
    .sort((a,b)=>{ const t=(eq.type||'').toLowerCase(); const am=new RegExp(t,'i').test(a.name||'')?0:1, bm=new RegExp(t,'i').test(b.name||'')?0:1; return am-bm; })[0];
  const woodAlreadyMentioned = /worek drewna|pakiet drewna|drewno/i.test(extras||'');
  const woodLine = woodAlreadyMentioned
    ? (woodPkg ? `\n🔥 Każdy kolejny worek drewna: ${fmt(woodPkg.price)}.` : '')
    : `\n🔥 Pierwszy worek drewna na rozpalenie — gratis od nas${woodPkg?`, każdy kolejny ${fmt(woodPkg.price)}`:''}.`;
  return `${greet} Oto Twoja oferta GardenSpa 🌿🛁\n${headLine}${dateLine}${extrasLine}${customLine}\n${breakdown}\nRazem: ${fmt(payableNow)}${zadClause}.\nDodatkowo kaucja zwrotna: ${fmt(calc.deposit)} płatna w dniu wynajmu.${woodLine}${altBlock}${nudge}${validLine}\n📩 Żeby zarezerwować ten termin, odpisz i wpłać zadatek ${fmt(zadShown>0?zadShown:calc.zadatek)} BLIK-iem na numer ${settings.blik_phone||''} — termin blokujemy od razu po wpłacie.\n📸 Zobacz naszą nową balię i saunę na zdjęciach: ${settings.social_url||'https://linktr.ee/GardenSpa_Wellness_'}`;
}

  const [msg,setMsg]=useState(null);
  const [loading,setLoading]=useState(true);

  const [settings,setSettings]=useState({free_km:60,km_rate:2,zadatek:200,referral_pct:15,offer_valid_mode:'hours',offer_valid_value:48,offer_valid_date:'',blik_phone:'',company_name:'GardenSpa'});
  const [equipment,setEquipment]=useState([]);
  const [packages,setPackages]=useState([]);
  const [tiers,setTiers]=useState([]);
  const [clients,setClients]=useState([]);
  const [offers,setOffers]=useState([]);
  const [vouchers,setVouchers]=useState([]);
  const [reviews,setReviews]=useState([]);
  const [costs,setCosts]=useState([]);

  const flash = t => { setMsg(t); setTimeout(()=>setMsg(null),3000); };

  const reload = useCallback(async ()=>{
    setLoading(true); setErr(null);
    try{
      const results = await Promise.allSettled([
        sbGet("gs_settings","id=eq.1"),
        sbGet("gs_equipment","order=name"),
        sbGet("gs_packages","order=name"),
        sbGet("gs_tiers","order=mode"),
        sbGet("gs_clients","order=created_at.desc"),
        sbGet("gs_offers","order=created_at.desc"),
        sbGet("gs_vouchers","order=created_at.desc"),
        sbGet("gs_reviews","order=created_at.desc"),
        sbGet("gs_costs","order=name"),
      ]);
      const [s,e,p,t,c,o,v,r,co] = results;
      if(s.status==="fulfilled" && s.value[0]) setSettings(prev=>({...prev,...s.value[0]}));
      if(e.status==="fulfilled") setEquipment(e.value);
      if(p.status==="fulfilled") setPackages(p.value);
      if(t.status==="fulfilled") setTiers(t.value);
      if(c.status==="fulfilled") setClients(c.value);
      if(o.status==="fulfilled") setOffers((o.value||[]).map(x=>({...x, addon_ids:x.addon_ids||[], extra_equip_ids:x.extra_equip_ids||[], custom_items:x.custom_items||[], alt_options:x.alt_options||[], set_prices:x.set_prices||{}})));
      if(v.status==="fulfilled") setVouchers(v.value);
      if(r.status==="fulfilled") setReviews(r.value);
      if(co.status==="fulfilled") setCosts(co.value);
      const failed = results.filter(x=>x.status==="rejected");
      if(failed.length) setErr("Część tabel jeszcze nie istnieje w Supabase — uruchom SQL na dole pliku źródłowego (sekcja komentarza) w SQL Editor. Szczegóły: " + String(failed[0].reason && failed[0].reason.message||failed[0].reason).slice(0,200));
    }catch(ex){ setErr(String(ex.message||ex)); }
    setLoading(false);
  },[]);

  useEffect(()=>{ reload(); },[reload]);

  const NAV = [
    ["pulpit","🏠","Pulpit"],["kalendarz","📅","Kalendarz"],["klienci","📇","Klienci"],
    ["oferty","📄","Oferty"],["opinie","⭐","Opinie"],["raport","📊","Raport"],["ustawienia","⚙️","Ustaw."],
  ];

  return (
    <div className="app">
      <div className="app-header">
        <img src={settings.logo_url||LOGO} alt="logo"/>
        <div className="brand">{settings.company_name||"GardenSpa"}<small>Wynajem balii i sauny</small></div>
      </div>
      <div className="main">
        {err && <div className="banner err"><span>⚠️</span><div>{err}<div style={{marginTop:8}}><button className="btn ghost sm" onClick={reload}>Spróbuj ponownie</button></div></div></div>}
        {msg && <div className="banner ok"><span>✅</span><div>{msg}</div></div>}
        {loading ? <div className="empty">Ładowanie…</div> : (
          <>
            {tab==="pulpit" && <Pulpit {...{equipment,offers,clients,settings,setTab,vouchers,goOffer}}/>}
            {tab==="kalendarz" && <Kalendarz {...{equipment,offers,clients,goOffer,initialYm:nav.calYm,clearCalYm}}/>}
            {tab==="klienci" && <Klienci {...{clients,setClients,offers,equipment,settings,packages,tiers,vouchers,setOffers,flash,setErr,reload,setTab}}/>}
            {tab==="oferty" && <Oferty {...{offers,setOffers,equipment,packages,tiers,clients,setClients,settings,vouchers,setVouchers,flash,setErr,reload,focusOfferId:nav.focusOfferId,clearFocus:()=>setNav(n=>({...n,focusOfferId:null}))}}/>}
            {tab==="opinie" && <Opinie {...{reviews,setReviews,clients,offers,equipment,packages,vouchers,flash,setErr}}/>}
            {tab==="raport" && <Raport {...{offers,equipment,settings,packages,clients,vouchers,costs,goCalendar}}/>}
            {tab==="ustawienia" && <Ustawienia {...{settings,setSettings,equipment,setEquipment,packages,setPackages,tiers,setTiers,costs,setCosts,flash,setErr,reload}}/>}
          </>
        )}
      </div>
      <nav className="bottom">
        {NAV.map(([k,ic,l])=>(
          <button key={k} className={tab===k?"active":""} onClick={()=>setTab(k)}>
            <span className="ic">{ic}</span>{l}

        build {BUILD} · <span style={{textDecoration:"underline",cursor:"pointer"}} onClick={()=>{location.href=location.pathname+"?v="+Date.now();}}>odśwież aplikację</span>

  );
}

/* ================= PULPIT ================= */
function Pulpit({equipment,offers,clients,settings,setTab,vouchers,goOffer}){
  const [drill,setDrill]=useState(null);
  const today = new Date();
  const tNum = today.getFullYear()*10000+today.getMonth()*100+today.getDate();
  const dateNum = o => o.year*10000+o.month*100+o.day;
  const endNum = o => { const d=new Date(o.year,o.month,o.day+((o.days||1))); return d.getFullYear()*10000+d.getMonth()*100+d.getDate(); };
  const live = offers.filter(o=>o.status!=="draft" && o.status!=="done");
  const deliveriesToday = live.filter(o=>dateNum(o)===tNum);
  const pickupsToday = live.filter(o=>endNum(o)===tNum && dateNum(o)!==tNum);
  const inProgress = live.filter(o=>dateNum(o)<=tNum && endNum(o)>=tNum);
  const busyIds = new Set(); inProgress.forEach(o=>{ busyIds.add(o.equipment_id); (o.extra_equip_ids||[]).forEach(id=>busyIds.add(id)); });
  const freeEquip = equipment.filter(e=>!busyIds.has(e.id));
  const todayOffers = [...deliveriesToday,...pickupsToday];
  const freeCount = freeEquip.length;
  const nameOf = o => { const c=clients.find(c=>c.phone===o.phone); return displayName(o.phone,(c&&c.name)||o.name); };
  const eqLabel = o => { const eq=equipment.find(e=>e.id===o.equipment_id); const extra=(o.extra_equip_ids||[]).length; return (eq?eq.name:"—")+(extra?` + ${extra} (zestaw)`:""); };
  const endLabel = o => { const e=new Date(o.year,o.month,o.day+(o.days||1)); return `${e.getDate()}.${e.getMonth()+1}.${e.getFullYear()}`; };
  const alerts = [
    ...deliveriesToday.map(o=>({icon:"🚚", text:`Dostawa dziś: ${eqLabel(o)} → ${nameOf(o)}`, o})),
    ...pickupsToday.map(o=>({icon:"📦", text:`Odbiór dziś: ${eqLabel(o)} od ${nameOf(o)}`, o})),
    ...inProgress.filter(o=>dateNum(o)!==tNum && endNum(o)!==tNum).map(o=>({icon:"🔄", text:`Trwa wynajem: ${eqLabel(o)} · ${nameOf(o)} (do ${endLabel(o)})`, o})),
  ];
  if(!alerts.length) alerts.push({icon:"✓", text:"Brak dzisiejszych dostaw/odbiorów."});
  const todayNum = tNum;
  const upcoming = live.filter(o=>dateNum(o)>todayNum).sort((a,b)=>dateNum(a)-dateNum(b)).slice(0,4);
  return (
    <div>
      <div className="topbar"><div><h1>Pulpit</h1><p>Wynajem balii i sauny</p></div></div>
      <div className="grid row2" style={{marginBottom:8}}>
        <div className="card stat" style={{cursor:"pointer"}} onClick={()=>setDrill(drill==="del"?null:"del")}><div className="v">{deliveriesToday.length}</div><div className="l">🚚 Dostawy dziś</div></div>
        <div className="card stat" style={{cursor:"pointer"}} onClick={()=>setDrill(drill==="pick"?null:"pick")}><div className="v">{pickupsToday.length}</div><div className="l">📦 Odbiory dziś</div></div>
      </div>
      <div className="grid row2" style={{marginBottom:drill?8:16}}>
        <div className="card stat" style={{cursor:"pointer"}} onClick={()=>setDrill(drill==="prog"?null:"prog")}><div className="v">{inProgress.length}</div><div className="l">🔄 Trwające wynajmy</div></div>
        <div className="card stat" style={{cursor:"pointer"}} onClick={()=>setDrill(drill==="free"?null:"free")}><div className="v">{freeCount}</div><div className="l">Wolny sprzęt dziś</div></div>
      </div>
      {drill && <div className="card" style={{marginBottom:16,background:"#faf9f5"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <b style={{color:"var(--green-d)",fontSize:13}}>{drill==="del"?"🚚 Dostawy dziś":drill==="pick"?"📦 Odbiory dziś":drill==="prog"?"🔄 Trwające wynajmy (obejmują dzisiejszą datę)":"Wolny sprzęt dziś"}</b>
          <button className="btn ghost sm" onClick={()=>setDrill(null)}>✕</button>
        </div>
        {drill==="free" ? (freeEquip.length? freeEquip.map(e=>(<div key={e.id} style={{fontSize:12.5,padding:"5px 0",borderBottom:"1px solid var(--line)"}}>{e.name}</div>)) : <div className="muted" style={{fontSize:12.5}}>Cały sprzęt zajęty.</div>)
          : ((drill==="del"?deliveriesToday:drill==="pick"?pickupsToday:inProgress).length
            ? (drill==="del"?deliveriesToday:drill==="pick"?pickupsToday:inProgress).map(o=>(
                <div key={o.id} style={{fontSize:12.5,padding:"5px 0",borderBottom:"1px solid var(--line)",cursor:"pointer"}} onClick={()=>goOffer(o)}>
                  <b>{eqLabel(o)}</b> · {nameOf(o)} <span className="muted">— {dateRangeLabel(o)}</span>
                </div>))
            : <div className="muted" style={{fontSize:12.5}}>Brak pozycji.</div>)}
      </div>}
      <div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}>
        <button className="btn primary" onClick={()=>setTab("oferty")}>+ Nowa oferta / kalkulator</button>
        <button className="btn ghost" onClick={()=>setTab("kalendarz")}>Sprawdź dostępność</button>
      </div>
      <h3 style={{fontSize:12.5,color:"var(--muted)",textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Wymaga uwagi</h3>
      {alerts.map((a,i)=>(<div key={i} className="card" style={{display:"flex",gap:10,alignItems:"center",marginBottom:8,padding:"10px 14px",cursor:a.o?"pointer":"default"}} onClick={()=>a.o&&goOffer(a.o)}><span>{a.icon}</span><span>{a.text}</span></div>))}
      <h3 style={{fontSize:12.5,color:"var(--muted)",textTransform:"uppercase",letterSpacing:.5,margin:"18px 0 8px"}}>Nadchodzące</h3>
      {upcoming.length===0 && <div className="empty">Brak nadchodzących zleceń.</div>}
      {upcoming.map(o=>(
        <div key={o.id} className="card" style={{display:"flex",justifyContent:"space-between",marginBottom:8,padding:"10px 14px",cursor:"pointer"}} onClick={()=>goOffer(o)}>
          <span>{eqLabel(o)} · {nameOf(o)}</span><span className="muted">{o.day}.{o.month+1}</span></div>))}
      {(vouchers||[]).filter(v=>isVoucherUsable(v)).length>0 && <>
        <h3 style={{fontSize:12.5,color:"var(--muted)",textTransform:"uppercase",letterSpacing:.5,margin:"18px 0 8px"}}>🎁 Aktywne vouchery</h3>
        {vouchers.filter(v=>isVoucherUsable(v)).map(v=>{ const buyer=clients.find(c=>c.phone===v.buyer_phone); const st=voucherStatus(v);
          return (<div key={v.id} className="card" style={{display:"flex",justifyContent:"space-between",marginBottom:8,padding:"10px 14px",cursor:"pointer"}} onClick={()=>setTab("oferty")}>
            <span><b>{v.code}</b> · {displayName(v.buyer_phone,(buyer&&buyer.name)||v.buyer_name)}</span>
            <span className={"badge "+st.cls}>{st.label}</span>
          </div>); })}
      </>}
    </div>
  );
}

/* ================= KALENDARZ ================= */
function Kalendarz({equipment,offers,clients,goOffer,initialYm,clearCalYm}){
  const now = new Date();
  const [ym,setYm]=useState(initialYm||{y:now.getFullYear(),m:now.getMonth()});
  useEffect(()=>{ if(initialYm){ setYm(initialYm); clearCalYm&&clearCalYm(); } },[initialYm&&initialYm.y,initialYm&&initialYm.m]);
  const first = new Date(ym.y,ym.m,1); const last = new Date(ym.y,ym.m+1,0);
  const startOffset = (first.getDay()+6)%7;
  const [dayDetail,setDayDetail]=useState(null);
  const booked = {};
  const isExpiredCal = o => o.status==="sent" && !o.zadatek_paid && o.expires_at && new Date(o.expires_at) < new Date();
  offers.filter(o=>o.status!=="done" && !isExpiredCal(o)).forEach(o=>{
    const ids = [o.equipment_id,...(o.extra_equip_ids||[])];
    const eqs = ids.map(id=>equipment.find(e=>e.id===id)).filter(Boolean);
    const eq = eqs[0];
    const isSet = eqs.length>1;
    const isPending = o.status==="draft" || (o.status==="sent" && !o.zadatek_paid);
    const start = new Date(o.year,o.month,o.day);
    for(let i=0; i<=(o.days||1); i++){
      const dt = new Date(start); dt.setDate(dt.getDate()+i);
      if(dt.getFullYear()!==ym.y || dt.getMonth()!==ym.m) continue;
      const d = dt.getDate();
      const prev = booked[d];
      const colors = eqs.map(e=>e.color||"#153826");
      const hasInvoice = !!o.invoice_issued;
      if(prev){
        const allOffers = [...prev.offers,o];
        booked[d] = {...prev, colors:[...new Set([...prev.colors,...colors])], sets: prev.sets||isSet,
          offers: allOffers, multiClient: [...new Set(allOffers.map(x=>x.phone))].length>1,
          anyInvoice: prev.anyInvoice || hasInvoice, pending: prev.pending || isPending};
      } else {
        booked[d] = {colors, shape:eq?eq.shape||"square":"square", pending:isPending, gift:!!o.voucher_code, sets:isSet, offers:[o], multiClient:false, offer:o, anyInvoice:hasInvoice};
      }
    }
  });
  const cells=[]; for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=last.getDate(); d++) cells.push(d);
  const monthOffers = offers.filter(o=>o.status!=="draft" && o.year===ym.y && o.month===ym.m);
  return (
    <div>
      <div className="topbar"><div><h1>Kalendarz</h1><p>Dostępność sprzętu</p></div></div>
      <div className="card">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <button className="btn ghost sm" onClick={()=>{ const d=new Date(ym.y,ym.m-1,1); setYm({y:d.getFullYear(),m:d.getMonth()}); }}>‹</button>
          <b style={{color:"var(--green-d)",fontFamily:"Georgia,serif"}}>{MONTHS[ym.m]} {ym.y}</b>
          <button className="btn ghost sm" onClick={()=>{ const d=new Date(ym.y,ym.m+1,1); setYm({y:d.getFullYear(),m:d.getMonth()}); }}>›</button>
        </div>

          {WEEKDAYS.map(d=>(<div key={d} style={{fontSize:11,textAlign:"center",color:"var(--muted)",fontWeight:700}}>{d}</div>))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:14}}>
          {cells.map((d,i)=>{
            if(d==null) return <div key={i} className="calcell" style={{background:"#f8f7f1",border:"none"}}/>;
            const dow=(startOffset+d-1)%7; const isWeekend=dow===5||dow===6;
            const b=booked[d];
            const isCyl = b && b.shape==='cylinder';
            const radius = b ? (b.shape==='round'?'50%':isCyl?'50%/30%':'0px') : '8px';
            const pending = b && b.pending;
            const c0 = b ? b.colors[0] : null;
            // Dla pending: przymywamy kolor sprzętu białym, żeby dostać jasny wariant.
            // Widać KOLOR (który sprzęt) + gradient (zestaw), a przerywana ramka mówi że to bez zadatku.
            const colorBg = b ? (b.colors.length>1
              ? `linear-gradient(135deg, ${b.colors.map((c,ci)=>`${c} ${ci*100/b.colors.length}%, ${c} ${(ci+1)*100/b.colors.length}%`).join(', ')})`
              : c0) : null;
            const bg = b ? (pending
              ? `linear-gradient(rgba(255,255,255,.72), rgba(255,255,255,.72)), ${colorBg}`  /* jasny wariant koloru sprzętu */
              : colorBg) : (isWeekend?"#f4ecdc":"#fff");
            return (<div key={i} className="calcell" onClick={()=>b&&setDayDetail({day:d,info:b})} style={{
              background:bg,
              color:b?(pending?c0:"#fff"):"var(--ink)",
              border:pending?`2px dashed ${c0}`:(isWeekend?"1.5px solid #d8c68a":"1px solid var(--line)"),

              boxShadow:b&&(b.sets||b.multiClient||(b.offers||[]).length>1)?"inset 0 0 0 2px #fff":"none",
              fontWeight:pending?700:400
            }}>

              <span style={{position:"relative",zIndex:1,textShadow:b&&!pending?"0 1px 2px rgba(0,0,0,.45)":"none"}}>{d}</span>
              {b && b.gift && <span style={{position:"absolute",top:-2,right:-1,fontSize:9,zIndex:2}}>🎁</span>}
              {b && b.multiClient && <span style={{position:"absolute",bottom:0,left:2,fontSize:8,fontWeight:700,zIndex:2,lineHeight:1,textShadow:"0 1px 2px rgba(0,0,0,.5)"}}>👥</span>}
              {b && !b.multiClient && (b.offers||[]).length>1 && <span style={{position:"absolute",bottom:0,left:2,fontSize:8,fontWeight:700,zIndex:2,lineHeight:1,textShadow:"0 1px 2px rgba(0,0,0,.5)"}}>🗓</span>}
              {b && !b.multiClient && (b.offers||[]).length===1 && b.sets && <span style={{position:"absolute",bottom:0,left:2,fontSize:8,fontWeight:700,zIndex:2,lineHeight:1,textShadow:"0 1px 2px rgba(0,0,0,.5)"}}>🔗</span>}
            </div>);
          })}
        </div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",fontSize:11,color:"var(--muted)",marginBottom:16}}>
          {equipment.map(e=>(<span key={e.id}><span style={{display:"inline-block",width:12,height:9,background:e.color||"#153826",position:"relative",overflow:"hidden",
            borderRadius:e.shape==='round'?'50%':e.shape==='cylinder'?'50%/30%':2,marginRight:5}}>
            {e.shape==='cylinder' && <><span style={{position:"absolute",left:0,right:0,top:"28%",height:1,background:"rgba(255,255,255,.45)"}}/><span style={{position:"absolute",left:0,right:0,top:"68%",height:1,background:"rgba(255,255,255,.45)"}}/></>}
            </span>{e.name}</span>))}
          <span><span style={{display:"inline-block",width:12,height:9,border:"1.5px dashed #8a8378",borderRadius:2,marginRight:5}}/>Oferta bez zadatku (robocza lub wysłana)</span>
          <span><span style={{display:"inline-block",width:12,height:9,background:"linear-gradient(135deg,#153826 0%,#153826 50%,#c9a227 50%,#c9a227 100%)",boxShadow:"inset 0 0 0 1.5px #fff",marginRight:5}}/>🔗 Zestaw (1 klient, 2+ sprzęty)</span>
          <span>🗓 Kilka osobnych wynajmów 1 klienta</span>
          <span>👥 Różni klienci w tym dniu</span>
          <span>🎁 Realizacja vouchera</span>
        </div>
        <h3 style={{fontSize:12,color:"var(--muted)",textTransform:"uppercase",marginBottom:8}}>Rezerwacje w tym miesiącu</h3>
        {monthOffers.length===0 && <div className="empty">Brak rezerwacji.</div>}
        {monthOffers.map(o=>{ const eq=equipment.find(e=>e.id===o.equipment_id); const c=clients.find(c=>c.phone===o.phone);
          const calc = computeCalc(o,equipment,{free_km:60,km_rate:2,zadatek:200},[], clients, []);
          const extra=(o.extra_equip_ids||[]).length;
          return (<div key={o.id} style={{padding:"8px 0",borderBottom:"1px solid var(--line)",fontSize:13,cursor:"pointer"}} onClick={()=>goOffer&&goOffer(o)}>
            <b>{eq?eq.name:"—"}{extra?` + ${extra} 🔗`:""}</b> · {displayName(o.phone,(c&&c.name)||o.name)} <span className="muted">— {dateRangeLabel(o)} · {fmt(calc.total-calc.deposit)}</span></div>); })}
      </div>
      {dayDetail && (()=>{ const info=dayDetail.info; const dOffers=info.offers||[];
        return (
        <div className="modal-overlay" onClick={()=>setDayDetail(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <h2>{dayDetail.day} {MONTHS[ym.m]} {ym.y}</h2>
              <button className="btn ghost sm" onClick={()=>setDayDetail(null)}>✕</button>

            </p>
            {dOffers.map(o=>{ const c=clients.find(x=>x.phone===o.phone);
              const eqs=[o.equipment_id,...(o.extra_equip_ids||[])].map(id=>equipment.find(e=>e.id===id)).filter(Boolean);
              const calc=computeCalc(o,equipment,{free_km:60,km_rate:2,zadatek:200},[],clients,[]);
              const st = o.status==="draft"?"📝 Robocza":o.status==="sent"?(o.zadatek_paid?"💚 Wysłana + zadatek":"⏳ Oferta wysłana — brak zadatku"):o.status==="done"?"✅ Zrealizowane":isInProgress(o)?"🔄 W trakcie najmu":"📅 Zarezerwowane";
              return (<div key={o.id} className="card" style={{marginBottom:8,cursor:"pointer"}} onClick={()=>{setDayDetail(null); goOffer&&goOffer(o);}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start"}}>
                  <div style={{minWidth:0}}>
                    <b>{displayName(o.phone,(c&&c.name)||o.name)}</b>
                    <div style={{fontSize:12.5,marginTop:3,display:"flex",flexWrap:"wrap",gap:6,alignItems:"center"}}>
                      {eqs.map(e=>(<span key={e.id} style={{display:"inline-flex",alignItems:"center",gap:4}}>
                        <span style={{width:10,height:8,background:e.color||"#153826",borderRadius:e.shape==='round'?'50%':e.shape==='cylinder'?'50%/30%':2,display:"inline-block"}}/>{e.name}</span>))}
                      {eqs.length>1 && <span style={{fontSize:11,color:"var(--muted)"}}>🔗 zestaw</span>}
                    </div>
                    <div className="muted" style={{fontSize:12,marginTop:3}}>{dateRangeLabel(o)}{o.delivery_address?" · "+o.delivery_address:""}</div>
                  </div>
                  <div style={{textAlign:"right",whiteSpace:"nowrap"}}>
                    <b style={{color:"var(--green-d)"}}>{fmt(calc.total-calc.deposit)}</b>
                    <div className="muted" style={{fontSize:11,marginTop:2}}>{st}</div>

                </div>

          </div>

    </div>
  );
}

function Klienci({clients,setClients,offers,equipment,settings,packages,tiers,vouchers,setOffers,flash,setErr,reload,setTab}){
  const [search,setSearch]=useState("");
  const [selPhone,setSelPhone]=useState(null);
  const [checked,setChecked]=useState({});
  const [broadcast,setBroadcast]=useState(null);
  const digits = search.replace(/\D/g,"");
  const filtered = clients.filter(c=>!digits || c.phone.replace(/\D/g,"").includes(digits));
  const showAddNew = digits.length>=6 && !clients.some(c=>c.phone.replace(/\D/g,"")===digits);
  const sel = clients.find(c=>c.phone===selPhone);

  const addClient = async ()=>{
    try{ const ins = await sbInsert("gs_clients",{phone:search, name:"", city:"", referral_pct_pending:0});
      setClients(p=>[ins[0],...p]); setSelPhone(search); setSearch(""); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };
  const updateClient = async (patch)=>{
    try{ await sbUpdate("gs_clients","id",sel.id,patch); setClients(p=>p.map(c=>c.id===sel.id?{...c,...patch}:c)); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };
  const history = sel ? offers.filter(o=>o.phone===sel.phone) : [];

  if(sel){
    return (
      <div>
        <div className="topbar"><div><h1>Klienci</h1><p>Szczegóły klienta</p></div></div>

        <div className="card" style={{marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <b style={{fontSize:16}}>{displayName(sel.phone,sel.name)}</b>
            {sel.referral_status && sel.referral_status!=="active" && (
              <span className={"badge "+(sel.referral_status==="used"?"b-green":sel.referral_status==="sent"?"b-blue":"b-grey")}>
                {sel.referral_status==="used"?"✅ Kod zrealizowany":sel.referral_status==="sent"?"📤 Kod wysłany":sel.referral_status}
              </span>
            )}
          </div>
          <div className="muted" style={{marginBottom:4}}>{sel.phone}</div>
          <details style={{marginBottom:10}}>
            <summary style={{cursor:"pointer",fontSize:12.5,color:"var(--green-d)",fontWeight:600,padding:"6px 0"}}>🎁 Kod polecenia {sel.referral_pct_pending>0 && !sel.referral_discount_value ? `(${sel.referral_pct_pending}% do wykorzystania)` : (sel.referral_discount_value?`(${sel.referral_discount_value}${sel.referral_discount_type==='amount'?' zł':'%'} do wykorzystania)`:'')}</summary>
            <div style={{marginTop:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
                <span style={{fontSize:12,color:"var(--muted)"}}>Kod:</span>
                <input defaultValue={sel.referral_code||referralCode(sel)} onBlur={e=>updateClient({referral_code:e.target.value.toUpperCase()})} style={{width:110,fontWeight:700,color:"var(--green-d)",padding:"2px 8px"}}/>
                <select value={sel.referral_status||"active"} onChange={e=>updateClient({referral_status:e.target.value})} style={{width:"auto",padding:"4px 8px",fontSize:12}}>
                  <option value="active">🟢 Aktywny</option>
                  <option value="sent">📤 Wysłany</option>
                  <option value="used">✅ Zrealizowany</option>
                </select>
              </div>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <a className="btn ghost sm" href={`https://wa.me/${waPhone(sel.phone)}?text=${encodeURIComponent(referralMsg(sel,settings))}`} target="_blank" rel="noopener" onClick={()=>updateClient({referral_status:"sent"})} style={{flex:1,textAlign:"center"}}>WhatsApp</a>
                <a className="btn ghost sm" href={`sms:${sel.phone}?&body=${encodeURIComponent(referralMsg(sel,settings))}`} onClick={()=>updateClient({referral_status:"sent"})} style={{flex:1,textAlign:"center"}}>SMS</a>
              </div>
              <div className="row2">
                <div className="field"><label>Typ rabatu polecenia</label>
                  <select value={sel.referral_discount_type||"percent"} onChange={e=>updateClient({referral_discount_type:e.target.value})}>
                    <option value="percent">Procentowy (%)</option>
                    <option value="amount">Kwotowy (zł)</option>
                  </select>
                </div>
                <div className="field"><label>Wartość rabatu</label><input type="number" defaultValue={sel.referral_discount_value||sel.referral_pct_pending||0} onBlur={e=>updateClient({referral_discount_value:+e.target.value||0})}/></div>
              </div>
              <div className="field"><label>Kod ważny do (opcjonalnie)</label><input type="date" defaultValue={sel.referral_valid_until||""} onChange={e=>updateClient({referral_valid_until:e.target.value||null})}/></div>
            </div>
          </details>
          <div className="row2">
            <div className="field"><label>Typ klienta</label>
              <select defaultValue={sel.client_type||"private"} onChange={e=>updateClient({client_type:e.target.value})}>
                <option value="private">Osoba fizyczna</option>
                <option value="company">Firma</option>
              </select>
            </div>
            <div className="field"><label>Imię i nazwisko</label><input defaultValue={sel.name||""} onBlur={e=>updateClient({name:e.target.value})}/></div>

            <div className="field"><label>Miejscowość (opcjonalnie)</label><input defaultValue={sel.city||""} onBlur={e=>updateClient({city:e.target.value})}/></div>

            <button className="btn primary sm" onClick={()=>setTab("oferty")}>+ Nowa oferta</button>

        </div>
        <h3 style={{fontSize:12,color:"var(--muted)",textTransform:"uppercase",marginBottom:8}}>Historia</h3>
        {history.length===0 && <div className="empty">Brak wcześniejszych zleceń.</div>}
        {history.map(o=>{ const eq=equipment.find(e=>e.id===o.equipment_id);
          const calc = computeCalc(o,equipment,settings,packages,clients,vouchers);
          const stMap={draft:["Robocza","b-grey"],sent:["Wysłana","b-blue"],accepted:["Zaakceptowana","b-green"],done:["Zrealizowana","b-amber"]};
          const st = isInProgress(o) ? ["🔄 W trakcie najmu","b-blue"] : (stMap[o.status]||stMap.draft);
          return (<div key={o.id} className="card" style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <div><b>{eq?eq.name:"—"}{calc.extraEquip.length>0?` + ${calc.extraEquip.map(e=>e.name).join(" + ")}`:""}</b><div className="muted" style={{fontSize:12}}>{dateRangeLabel(o)}</div></div>
            <div style={{textAlign:"right"}}><span className={"badge "+st[1]}>{st[0]}</span><div style={{fontWeight:700}}>{fmt(calc.total-calc.deposit)}</div></div>
          </div>); })}
      </div>
    );
  }

  return (
    <div>
      <div className="topbar"><div><h1>Klienci</h1><p>Szukaj po numerze telefonu</p></div></div>
      <div className="field"><input placeholder="np. 600 111 222" value={search} onChange={e=>setSearch(e.target.value)}/></div>
      {filtered.length>0 && !broadcast && (
        <div style={{marginBottom:10}}>
          <button className="btn ghost sm" onClick={()=>setBroadcast({text:"",step:"compose"})}>📣 Nowa wiadomość / promocja</button>
        </div>

      {filtered.map(c=>(<div key={c.id} className="card" style={{display:"flex",alignItems:"center",marginBottom:8,gap:10}}>
        <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>setSelPhone(c.phone)}>
          <b>{displayName(c.phone,c.name)}</b><div className="muted" style={{fontSize:12}}>{c.phone}</div>
        </div>
        <span className="muted" style={{fontSize:12,whiteSpace:"nowrap",cursor:"pointer"}} onClick={()=>setSelPhone(c.phone)}>{offers.filter(o=>o.phone===c.phone).length} zlec.</span>
      </div>))}
      {showAddNew && <button className="btn primary" onClick={addClient}>+ Dodaj nowy numer {search}</button>}
      {!filtered.length && !showAddNew && <div className="empty">Wpisz numer, aby wyszukać lub dodać klienta.</div>}
      {broadcast && <BroadcastModal clients={clients} filtered={filtered} onClose={()=>{setBroadcast(null);setSelecting(false);setChecked({});}}/>}
    </div>
  );
}

function BroadcastModal({clients,filtered,onClose}){
  const [text,setText]=useState("🌿 GardenSpa — nowość dla Ciebie!\n\nMamy dla Ciebie specjalną promocję na wynajem balii/sauny. Napisz, żeby zarezerwować termin! 🛁🔥");
  const [step,setStep]=useState("compose"); // compose | pick | send
  const [checked,setChecked]=useState({});
  const [sent,setSent]=useState({});
  const toggle=(id)=>setChecked(p=>({...p,[id]:!p[id]}));
  const allChecked = filtered.length>0 && filtered.every(c=>checked[c.id]);
  const recipients = filtered.filter(c=>checked[c.id]);
  const markSent=(id)=>setSent(p=>({...p,[id]:true}));

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <h2>{step==="compose"?"Treść wiadomości":step==="pick"?"Do kogo wysłać?":"Wysyłka"}</h2>
          <button className="btn ghost sm" onClick={onClose}>✕</button>
        </div>

        {step==="compose" && (<>
          <div className="field"><label>Treść wiadomości / promocji</label><textarea rows="6" value={text} onChange={e=>setText(e.target.value)}/></div>
          <button className="btn primary" style={{width:"100%"}} onClick={()=>setStep("pick")}>Dalej — wybierz odbiorców ›</button>
        </>)}

        {step==="pick" && (<>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,color:"var(--muted)",marginBottom:10}}>
            <input type="checkbox" checked={allChecked} onChange={e=>{ const v=e.target.checked; const patch={}; filtered.forEach(c=>patch[c.id]=v); setChecked(p=>({...p,...patch})); }} style={{width:16,height:16,flexShrink:0}}/>
            Zaznacz wszystkich ({filtered.length})
          </label>
          <div style={{maxHeight:340,overflowY:"auto"}}>
            {filtered.map(c=>(
              <div key={c.id} className="card" style={{display:"flex",alignItems:"center",marginBottom:8,gap:10}}>
                <input type="checkbox" checked={!!checked[c.id]} onChange={()=>toggle(c.id)} style={{width:16,height:16,flexShrink:0}}/>
                <div><b>{displayName(c.phone,c.name)}</b><div className="muted" style={{fontSize:12}}>{c.phone}</div></div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:8,marginTop:10}}>
            <button className="btn ghost" onClick={()=>setStep("compose")}>‹ Wróć</button>
            <button className="btn primary" style={{flex:1}} disabled={!recipients.length} onClick={()=>setStep("send")}>Dalej — wyślij do {recipients.length} ›</button>
          </div>
        </>)}

        {step==="send" && (<>
          <p className="muted" style={{fontSize:12,marginBottom:10}}>Każda wysyłka otwiera osobny draft (WhatsApp/SMS) — Ty klikasz "Wyślij" u każdego odbiorcy w swojej aplikacji.</p>
          {recipients.map(c=>{
            const phoneDigits = c.phone.replace(/\D/g,"");
            const waHref = `https://wa.me/48${phoneDigits.replace(/^48/,"")}?text=${encodeURIComponent(text)}`;
            const smsHref = `sms:${c.phone}?&body=${encodeURIComponent(text)}`;
            return (
              <div key={c.id} className="card" style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>
                <div><b>{displayName(c.phone,c.name)}</b><div className="muted" style={{fontSize:12}}>{c.phone}</div></div>
                <div style={{display:"flex",gap:6}}>
                  <a className="btn ghost sm" href={waHref} target="_blank" rel="noopener" onClick={()=>markSent(c.id)}>WhatsApp</a>
                  <a className="btn ghost sm" href={smsHref} onClick={()=>markSent(c.id)}>SMS</a>
                  {sent[c.id] && <span style={{color:"var(--green-d)",fontSize:16}}>✓</span>}
                </div>
              </div>
            );
          })}
          <button className="btn ghost" style={{marginTop:8}} onClick={()=>setStep("pick")}>‹ Wróć do listy odbiorców</button>
        </>)}
      </div>
    </div>
  );
}

function emptyForm(settings){

    year:new Date().getFullYear(), month:new Date().getMonth(), day:new Date().getDate(), days:1, status:"draft" };
}

function OfferFormModal({onClose, initial, equipment, packages, tiers, clients, settings, vouchers, onSave, offers}){
  const [f,setF]=useState(initial);
  const clientOptions = React.useMemo(()=>{
    const lastAt = {};
    (offers||[]).filter(o=>o.status!=="draft").forEach(o=>{ const n=o.year*10000+o.month*100+o.day; if(!lastAt[o.phone]||n>lastAt[o.phone]) lastAt[o.phone]=n; });
    return [...clients].sort((a,b)=>(lastAt[b.phone]||0)-(lastAt[a.phone]||0) || String(a.name||"").localeCompare(String(b.name||"")));
  },[clients,offers]);

          <div className="calc-line"><span>Transport<div className="muted" style={{fontSize:10.5,fontWeight:400,lineHeight:1.35}}>{(f.transport_override!=null && +f.transport_override>0) ? 'kwota wpisana ręcznie' : <>{f.km||0} km w 1 stronę × 4 przejazdy = {calc.kmTotal} km<br/>{settings.free_km*4} km w cenie · {calc.billKm} km płatne × {settings.km_rate} zł/km</>}</div></span><span>{fmt(calc.transport)}</span></div>
