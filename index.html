function Oferty({offers,setOffers,equipment,packages,tiers,clients,setClients,settings,vouchers,setVouchers,flash,setErr,focusOfferId,clearFocus}){
  const [modal,setModal]=useState(null); // 'new' or offer object for detail
  const [editingOffer,setEditingOffer]=useState(null);
  useEffect(()=>{ if(focusOfferId){ const o=offers.find(x=>x.id===focusOfferId); if(o){ setModal(o); clearFocus&&clearFocus(); } } },[focusOfferId]);
  const [view,setView]=useState("active"); // active | expired | done
  const [showDeposit,setShowDeposit]=useState(false);
  const [voucherModal,setVoucherModal]=useState(false);
  const [voucherEdit,setVoucherEdit]=useState(null);
  const [voucherTerm,setVoucherTerm]=useState(null);
  const [voucherSub,setVoucherSub]=useState("all");

  // AUTO-MIGRACJA STARYCH OFERT: przy pierwszym uruchomieniu tej wersji zamrażamy ceny wszystkich
  // istniejących ofert (tych bez frozen_rates), żeby zmiana cennika już ich nie ruszyła.
  useEffect(()=>{
    if(!equipment || equipment.length===0 || !offers || offers.length===0) return;
    const toFreeze = offers.filter(o => !o.frozen_rates || Object.keys(o.frozen_rates||{}).length===0);
    if(toFreeze.length===0) return;
    // Zamrażaj po cichu, w tle - nie blokujemy UI
    toFreeze.forEach(async o => {
      try {
        const snap = buildRateSnapshot(o, equipment, settings);
        await sbUpdate("gs_offers","id",o.id,snap);
        setOffers(p => p.map(x => x.id===o.id ? {...x, ...snap} : x));
      } catch(_){}
    });
  }, [equipment.length, offers.length]);

  const isExpired = o => o.status==="sent" && !o.zadatek_paid && o.expires_at && new Date(o.expires_at) < new Date();
  const statusOrder = {sent:0,accepted:1,draft:2,done:3};
  const rows = offers.filter(o=>{
    if(view==="vouchers") return false;
    if(view==="done") return o.status==="done";
    if(view==="expired") return isExpired(o);
    return o.status!=="done" && !isExpired(o);
  }).slice().sort((a,b)=>(statusOrder[a.status]??9)-(statusOrder[b.status]??9));

  const openShare = (o, kind) => {
    const c = clients.find(c=>c.phone===o.phone);
    const text = offerMsg(o,(c&&c.name)||o.name,settings,equipment,packages,tiers,clients,vouchers);
    let url;
    if(kind==="wa") url = `https://wa.me/${waPhone(o.phone)}?text=${encodeURIComponent(text)}`;
    else if(kind==="sms") url = `sms:${o.phone.replace(/\s/g,"")}?body=${encodeURIComponent(text)}`;
    else {
      // Messenger: użyj linku klienta jeśli podany; skopiuj treść do schowka (Messenger nie wspiera pre-fill)
      const link = c && c.messenger_link ? String(c.messenger_link).trim() : "";
      url = link ? (link.startsWith("http") ? link : link.startsWith("m.me/") ? "https://"+link : "https://m.me/"+link.replace(/^@/,"")) : "https://m.me/";
      if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(()=>{}); flash && flash("📋 Treść skopiowana — wklej w czacie (Ctrl+V lub długie przytrzymanie)."); }
      if(!link && c){ flash && flash("💡 Wskazówka: dodaj Messenger klienta w karcie klienta, żeby otwierać jego czat od razu."); }
    }
    // Zapisz kanał wysyłki i datę
    const via = kind==="wa" ? "whatsapp" : kind==="sms" ? "sms" : "messenger";
    sbUpdate("gs_offers","id",o.id,{sent_via:via, sent_at:new Date().toISOString()})
      .then(()=>{ setOffers(p=>p.map(x=>x.id===o.id?{...x,sent_via:via,sent_at:new Date().toISOString()}:x)); })
      .catch(()=>{});
    window.open(url,"_blank");
  };

  const saveOffer = async (f, mode) => {
    try{
      if(!f.phone){ setErr("Podaj numer telefonu klienta."); return; }
      const exists = clients.find(c=>c.phone===f.phone);
      let clientRow = exists;
      if(!exists){ const ins = await sbInsert("gs_clients",{phone:f.phone,name:f.name||"",city:f.delivery_address||"",referral_pct_pending:0}); clientRow=ins[0]; setClients(p=>[clientRow,...p]); }
      else {
        const patch={};
        if(f.name && !exists.name) patch.name=f.name;
        if(f.delivery_address && !exists.city) patch.city=f.delivery_address;
        if(Object.keys(patch).length){ await sbUpdate("gs_clients","id",exists.id,patch); setClients(p=>p.map(c=>c.id===exists.id?{...c,...patch}:c)); }
      }
      // referral reward
      if(f.referral_code){
        const referrer = clients.find(c=>referralCode(c)===String(f.referral_code).trim().toUpperCase() && c.phone!==f.phone);
        if(referrer){
          const validUntil = referrer.referral_valid_until || (settings.referral_default_days ? new Date(Date.now()+settings.referral_default_days*86400000).toISOString().slice(0,10) : null);
          await sbUpdate("gs_clients","id",referrer.id,{referral_pct_pending:settings.referral_pct, referral_discount_value:settings.referral_pct, referral_discount_type:'percent', referral_status:'active', referral_valid_until:validUntil});
          setClients(p=>p.map(c=>c.id===referrer.id?{...c,referral_pct_pending:settings.referral_pct, referral_discount_value:settings.referral_pct, referral_discount_type:'percent', referral_status:'active', referral_valid_until:validUntil}:c));
        }
      }
      // consume own pending discount (rabat wykorzystany w tej ofercie -> kod "zrealizowany")
      if(exists && (exists.referral_pct_pending || exists.referral_discount_value)){ await sbUpdate("gs_clients","id",exists.id,{referral_pct_pending:0, referral_discount_value:0, referral_status:'used'}); setClients(p=>p.map(c=>c.id===exists.id?{...c,referral_pct_pending:0, referral_discount_value:0, referral_status:'used'}:c)); }
      // redeem voucher
      if(f.voucher_code){
        const v = vouchers.find(v=>v.code===String(f.voucher_code).trim().toUpperCase());
        if(v && isVoucherUsable(v)){ await sbUpdate("gs_vouchers","id",v.id,{redeemed:true}); setVouchers(p=>p.map(x=>x.id===v.id?{...x,redeemed:true}:x)); }
      }
      const status = mode==="log_done" ? "done" : mode==="mark_accepted" ? "accepted" : mode==="draft_send" ? "sent" : "draft";
      // ZAMROŻENIE CEN: robimy migawkę cen sprzętu i ustawień z tej chwili — chronimy ofertę
      // przed zmianą po zmianie cennika w Ustawieniach. Klientka świadomie edytuje = ceny się aktualizują.
      const snap = buildRateSnapshot(f, equipment, settings);
      const body = { phone:f.phone, name:f.name, equipment_id:f.equipment_id, mode:f.mode, qty:f.qty, km:f.km,
        addon_ids:f.addon_ids, extra_equip_ids:f.extra_equip_ids, custom_items:f.custom_items,
        use_tier: f.use_tier!==false, alt_options: f.alt_options||[], set_prices: f.set_prices||{},
        referral_code: f.referral_code||"", apply_client_discount: f.apply_client_discount!==false,
        discount_type_override: f.discount_type_override||null,
        discount_value_override: (f.discount_value_override===""||f.discount_value_override==null)?null:+f.discount_value_override,
        rate_override: f.rate_override===""?null:+f.rate_override, transport_override: f.transport_override===""?null:+f.transport_override,
        zadatek_override: f.zadatek_override===""?null:+f.zadatek_override, deposit_override: f.deposit_override===""?null:+f.deposit_override,
        voucher_code:f.voucher_code, offer_cost:f.offer_cost, year:f.year, month:f.month, day:f.day, days:f.days||f.qty||1, delivery_address:f.delivery_address||"", deposit_returned:!!f.deposit_returned,
        frozen_rates: snap.frozen_rates, frozen_settings: snap.frozen_settings };
      if(f.id){
        const newStatus = f.status||"draft";
        const patch = {...body,status:newStatus};
        if(f.expires_at) patch.expires_at = f.expires_at;
        if(newStatus==="accepted" || newStatus==="done") patch.zadatek_paid = true;
        await sbUpdate("gs_offers","id",f.id,patch);
        setOffers(p=>p.map(x=>x.id===f.id?{...x,...patch}:x));
        setModal(null); setEditingOffer(null);
        if(newStatus==="done") setView("done");
        flash(newStatus==="done" ? "Oferta przeniesiona do zarchiwizowanych." : "Zaktualizowano ofertę.");
        return;
      }
      const year = f.year || new Date().getFullYear();
      const sameYear = offers.filter(o=>o.offer_no && o.offer_no.startsWith(`OF/${year}/`));
      const maxN = sameYear.reduce((m,o)=>Math.max(m, parseInt(o.offer_no.split('/')[2])||0), 0);
      const offer_no = `OF/${year}/${String(maxN+1).padStart(4,'0')}`;
      const insertBody = {...body, offer_no, status, expires_at: f.expires_at || computeExpiry(settings), zadatek_paid: mode==="log_done"||mode==="mark_accepted"};
      const ins = await sbInsert("gs_offers",insertBody);
      const newOffer = {...ins[0], addon_ids:ins[0].addon_ids||[], extra_equip_ids:ins[0].extra_equip_ids||[], custom_items:ins[0].custom_items||[]};
      setOffers(p=>[newOffer,...p]);
      setModal(null);
      if(mode==="log_done") setView("done");
      if(mode==="draft_send") openShare(newOffer,"sms");
      flash("Zapisano ofertę.");
    }catch(ex){ setErr(String(ex.message||ex)); throw ex; }
  };
  const markVoucherRedeemed = async (v) => {
    try{ await sbUpdate("gs_vouchers","id",v.id,{redeemed:true}); setVouchers(p=>p.map(x=>x.id===v.id?{...x,redeemed:true}:x));
      if(v.linked_offer_id){ await sbUpdate("gs_offers","id",v.linked_offer_id,{status:"done"}); setOffers(p=>p.map(x=>x.id===v.linked_offer_id?{...x,status:"done"}:x)); }
      flash("Voucher oznaczony jako zrealizowany."); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };
  const delVoucher = async (v) => {
    if(!confirm(`Usunąć voucher ${v.code}? Tej operacji nie można cofnąć.`)) return;
    try{ await sbDelete("gs_vouchers",v.id); setVouchers(p=>p.filter(x=>x.id!==v.id)); flash("Usunięto voucher."); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };
  const delOffer = async (o) => {
    if(!confirm("Usunąć tę ofertę/rezerwację? Tej operacji nie można cofnąć.")) return;
    try{ await sbDelete("gs_offers",o.id); setOffers(p=>p.filter(x=>x.id!==o.id)); setModal(null); flash("Usunięto ofertę."); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };

  const restoreOffer = async (o) => {
    try{ await sbUpdate("gs_offers","id",o.id,{status:"accepted"}); setOffers(p=>p.map(x=>x.id===o.id?{...x,status:"accepted"}:x)); flash("Przywrócono do aktywnych."); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };

  const advance = async (o) => {
    const order=["draft","sent","accepted","done"]; const i=order.indexOf(o.status); if(i>=order.length-1) return;
    const ns=order[i+1];
    // Zaakceptowana lub Zrealizowana = zadatek już wpłacony (bez tego nie byłoby akceptacji)
    const patch = {status:ns};
    if((ns==="accepted" || ns==="done") && !o.zadatek_paid){
      patch.zadatek_paid = true;
      patch.zadatek_paid_date = new Date().toISOString().slice(0,10);
    }
    try{ await sbUpdate("gs_offers","id",o.id,patch); setOffers(p=>p.map(x=>x.id===o.id?{...x,...patch}:x)); flash("Status: "+ns); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };
  const [extendModal, setExtendModal] = useState(null); // rezerwacja do przedłużenia
  const extendRental = (o) => setExtendModal(o);
  const markSent = async (o) => {
    try{ await sbUpdate("gs_offers","id",o.id,{status:"sent"}); setOffers(p=>p.map(x=>x.id===o.id?{...x,status:"sent"}:x)); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };
  const refreshExpiry = async (o) => {
    try{ const exp=computeExpiry(settings);
      await sbUpdate("gs_offers","id",o.id,{expires_at:exp}); setOffers(p=>p.map(x=>x.id===o.id?{...x,expires_at:exp}:x)); flash("Odświeżono ważność oferty."); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };
  const toggleZadatek = async (o) => {
    try{ await sbUpdate("gs_offers","id",o.id,{zadatek_paid:!o.zadatek_paid}); setOffers(p=>p.map(x=>x.id===o.id?{...x,zadatek_paid:!x.zadatek_paid}:x));
      setModal(m=>m && m.id===o.id ? {...m,zadatek_paid:!m.zadatek_paid} : m); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };
  const toggleInvoice = async (o) => {
    try{
      const nv = !o.invoice_issued;
      const patch = {invoice_issued: nv};
      if(nv && !o.invoice_date) patch.invoice_date = new Date().toISOString().slice(0,10);
      await sbUpdate("gs_offers","id",o.id,patch);
      setOffers(p=>p.map(x=>x.id===o.id?{...x,...patch}:x));
      setModal(m=>m && m.id===o.id ? {...m,...patch} : m);
      flash(nv?"📄 Oznaczono jako fakturowaną":"Zdjęto oznaczenie faktury");
    }catch(ex){ setErr(String(ex.message||ex)); }
  };

  const expiredCount = offers.filter(isExpired).length;
  const doneCount = offers.filter(o=>o.status==="done").length;
  const activeCount = offers.filter(o=>o.status!=="done" && !isExpired(o)).length;
  const voucherActiveCount = vouchers.filter(v=>isVoucherUsable(v)).length;
  const voucherExpiredCount = vouchers.filter(v=>!v.redeemed && isVoucherExpired(v)).length;
  const voucherDoneCount = vouchers.filter(v=>v.redeemed).length;

  return (
    <div>
      <div className="topbar"><div><h1>Oferty</h1><p>Wyceny i wysyłka</p></div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn primary" onClick={()=>setModal("new")}>+ Nowa oferta / przelicz cenę</button>
          <button className="btn gold" onClick={()=>setVoucherModal(true)}>🎁 Wystaw voucher</button>
        </div>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:view==="vouchers"?10:14,flexWrap:"wrap"}}>
        <button className={"btn sm "+(view==="active"?"primary":"ghost")} onClick={()=>setView("active")}>Aktywne ({activeCount})</button>
        <button className={"btn sm "+(view==="expired"?"primary":"ghost")} onClick={()=>setView("expired")}>⏳ Wygasłe ({expiredCount})</button>
        <button className={"btn sm "+(view==="done"?"primary":"ghost")} onClick={()=>setView("done")}>📦 Zarchiwizowane ({doneCount})</button>
        <button className={"btn sm "+(view==="vouchers"?"primary":"ghost")} onClick={()=>setView("vouchers")}>🎁 Vouchery ({vouchers.length})</button>
      </div>
      {view==="vouchers" ? (
        <>
          <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
            {[["all","Wszystkie",null],["active","Aktywne","#2e9e5b"],["term_set","Termin ustalony","#3b6fd6"],["done","Wykorzystane","#9a9488"],["expired","Wygasłe","#c0392b"]].map(([k,l,dot])=>{
              const cnt = k==="all"?vouchers.length:vouchers.filter(v=>{ const s=voucherStatus(v); return (k==="active"&&s.label==="Aktywny")||(k==="term_set"&&s.label==="Termin ustalony")||(k==="done"&&s.label==="Wykorzystany")||(k==="expired"&&s.label==="Wygasły"); }).length;
              return <button key={k} className={"btn sm "+(voucherSub===k?"primary":"ghost")} style={{display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap",flexShrink:0}} onClick={()=>setVoucherSub(k)}>
                {dot && <span style={{width:7,height:7,borderRadius:"50%",background:dot,display:"inline-block"}}/>}{l} ({cnt})
              </button>;
            })}
          </div>
          {vouchers.length===0 && <div className="empty">Brak wystawionych voucherów.</div>}
          {vouchers.filter(v=>{ if(voucherSub==="all") return true; const s=voucherStatus(v);
              return (voucherSub==="active"&&s.label==="Aktywny")||(voucherSub==="term_set"&&s.label==="Termin ustalony")||(voucherSub==="done"&&s.label==="Wykorzystany")||(voucherSub==="expired"&&s.label==="Wygasły"); })
            .slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(v=>{
            const st = voucherStatus(v);
            const buyer = clients.find(c=>c.phone===v.buyer_phone);
            const margin = (+(v.agreed_total||v.value)||0) - (+v.cost||0);
            const eq = v.equipment_id && equipment.find(e=>e.id===v.equipment_id);
            return (<div key={v.id} className="card" style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <div><b>{v.code}</b><div className="muted" style={{fontSize:12}}>{displayName(v.buyer_phone,(buyer&&buyer.name)||v.buyer_name)}{v.recipient_note?" · "+v.recipient_note:""}</div></div>
                <span className={"badge "+st.cls}>{st.label}</span>
              </div>
              {eq && <div className="muted" style={{fontSize:12,marginTop:4}}>🎁 {eq.name}{v.linked_offer_id?" · "+dateRangeLabel(v):""}</div>}
              <div style={{display:"flex",gap:16,marginTop:8,fontSize:12.5,flexWrap:"wrap"}}>
                <span>Wartość vouchera: <b>{fmt(v.value)}</b></span>
                {v.agreed_total>0 && <span>Uzgodniona kwota najmu: <b>{fmt(v.agreed_total)}</b></span>}
                <span className="muted">Koszt: {fmt(v.cost||0)}</span>
                <span style={{color:"var(--green-d)",fontWeight:700}}>Marża: {fmt(margin)}</span>
              </div>
              <div style={{marginTop:6}}><span className={"badge "+(v.payment_status==="paid_full"?"b-green":v.payment_status==="deposit"?"b-blue":"b-grey")}>{paymentLabel(v.payment_status)}</span></div>
              <div className="muted" style={{fontSize:11.5,marginTop:4}}>Ważny do {v.valid_until}</div>
              <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
                <button className="btn ghost sm" onClick={()=>setVoucherEdit(v)}>✏️ Edytuj</button>
                {!v.redeemed && !v.linked_offer_id && <button className="btn ghost sm" onClick={()=>setVoucherTerm(v)}>📅 Ustal termin realizacji</button>}
                {v.linked_offer_id && !v.redeemed && <button className="btn ghost sm" onClick={()=>markVoucherRedeemed(v)}>✅ Oznacz jako zrealizowany</button>}
                <button className="btn ghost sm" style={{color:"#b3261e",borderColor:"#e3b3ab"}} onClick={()=>delVoucher(v)}>🗑 Usuń</button>
              </div>
            </div>); })}
        </>
      ) : <></>}
      <button type="button" onClick={()=>setShowDeposit(v=>!v)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"12px 16px",marginBottom:12,borderRadius:11,border:"1px solid "+(showDeposit?"var(--green)":"var(--line)"),background:showDeposit?"var(--green-l)":"#fff",cursor:"pointer",fontSize:13.5,color:"var(--ink)",fontWeight:600}}>
        <span>💰 {showDeposit?"Kwoty razem z kaucją":"Kwoty bez kaucji"}</span>
        <span style={{width:38,height:22,borderRadius:11,background:showDeposit?"var(--green-d)":"#ccc",position:"relative",flexShrink:0,transition:"background .15s"}}>
          <span style={{position:"absolute",top:2,left:showDeposit?18:2,width:18,height:18,borderRadius:"50%",background:"#fff",transition:"left .15s"}}></span>
        </span>
      </button>
      {view!=="vouchers" && rows.length===0 && <div className="empty">Brak ofert w tym widoku.</div>}
      {view!=="vouchers" && rows.map(o=>{ const eq=equipment.find(e=>e.id===o.equipment_id); const c=clients.find(c=>c.phone===o.phone);
        const calc = computeCalc(o,equipment,settings,packages,clients,vouchers);
        const expired = isExpired(o);
        const stMap={draft:["Robocza","b-grey","Wyślij"],sent:["Wysłana","b-blue","Akceptuj"],accepted:["Zaakceptowana","b-green","Zrealizowano"],done:["Zrealizowana","b-amber",null]};
        const base = stMap[o.status]||stMap.draft;
        const st = isInProgress(o) ? ["🔄 W trakcie najmu","b-blue",base[2]] : base;
        const hoursLeft = o.expires_at ? Math.max(0,Math.round((new Date(o.expires_at)-new Date())/3600000)) : null;
        return (<div key={o.id} className="card" style={{marginBottom:10,cursor:"pointer"}} onClick={()=>setModal(o)}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <div><b>{eq?eq.name:"—"}{calc.extraEquip.length>0?` + ${calc.extraEquip.map(e=>e.name).join(" + ")}`:""}</b><div className="muted" style={{fontSize:12}}>{displayName(o.phone,(c&&c.name)||o.name)} · {dateRangeLabel(o)}</div></div>
            <span className={"badge "+(expired?"b-red":st[1])}>{expired?"Wygasła":st[0]}</span>
          </div>
          <div style={{fontWeight:700,color:"var(--green-d)",marginTop:6}}>{fmt(showDeposit?calc.total:calc.total-calc.deposit)}</div>
          {o.status==="sent" && <div style={{fontSize:11,color:"#9a6b00",marginTop:3}}>⏳ {expired?"Oferta wygasła — odśwież warunki":`Ważna jeszcze ${hoursLeft} godz.`}</div>}
          <div style={{display:"flex",gap:6,marginTop:9,flexWrap:"wrap"}} onClick={e=>e.stopPropagation()}>
            <span className="chip" onClick={()=>openShare(o,"sms")}>💬 SMS</span>
            <span className="chip" onClick={()=>openShare(o,"wa")}>🟢 WhatsApp</span>
            <span className="chip" onClick={()=>openShare(o,"msg")}>📩 Messenger</span>
            {isInProgress(o) && <span className="chip on" style={{background:"#fdf0d9",color:"#9a6b00"}} onClick={()=>extendRental(o)}>➕ Przedłuż</span>}
            {st[2] && !expired && o.status!=="accepted" && <span className="chip on" onClick={()=>{ if(o.status==="draft") markSent(o); else advance(o); }}>▸ {st[2]}</span>}
            {o.status==="accepted" && !expired && !isInProgress(o) && hasEnded(o) && <span className="chip on" style={{background:"#eee",color:"#555",border:"1px dashed #999"}} onClick={()=>{ if(confirm(`Przenieść ofertę do archiwum jako zrealizowaną?\n\nKlient: ${(clients.find(c=>c.phone===o.phone)?.name)||o.name||o.phone}\nSprzęt: ${eq?eq.name:'—'}\nTermin: ${dateRangeLabel(o)}\n\nUwaga: po zarchiwizowaniu oferta zniknie z listy aktywnych.`)) advance(o); }}>📦 Archiwizuj</span>}
            {o.status==="done" && <span className="chip" onClick={()=>restoreOffer(o)}>↩ Przywróć do aktywnych</span>}
            {expired && <span className="chip on" onClick={()=>refreshExpiry(o)} title="Klient się odezwał po terminie — przedłuż ważność oferty i wróć do aktywnych">↩ Przywróć jako aktywną</span>}
          </div>
          {o.sent_via && <div style={{fontSize:11,color:"#1b5e20",marginTop:6}}>✓ Wysłano przez: <b>{o.sent_via==="whatsapp"?"WhatsApp":o.sent_via==="sms"?"SMS":o.sent_via==="messenger"?"Messenger":o.sent_via}</b>{o.sent_at?" · "+new Date(o.sent_at).toLocaleDateString('pl-PL'):""}</div>}
        </div>); })}

      {(modal==="new"||editingOffer) && <OfferFormModal offers={offers} onClose={()=>{setModal(null);setEditingOffer(null);}} initial={editingOffer?{...editingOffer,days:editingOffer.days??editingOffer.qty??1,qty:editingOffer.days??editingOffer.qty??1}:emptyForm(settings)} equipment={equipment} packages={packages} tiers={tiers} clients={clients} settings={settings} vouchers={vouchers} onSave={saveOffer}/>}
      {modal && modal!=="new" && <OfferDetailModal offer={modal} onClose={()=>setModal(null)} equipment={equipment} packages={packages} tiers={tiers} clients={clients} settings={settings} vouchers={vouchers} onToggleZadatek={toggleZadatek} onToggleInvoice={toggleInvoice} onEdit={()=>{setEditingOffer(modal);setModal(null);}} onDelete={()=>delOffer(modal)} onExtend={()=>{ const o=modal; setModal(null); setExtendModal(o); }}/>}
      {voucherModal && <VoucherModal onClose={()=>setVoucherModal(false)} settings={settings} clients={clients} equipment={equipment} offers={offers} setOffers={setOffers} setErr={setErr} flash={flash} setVouchers={setVouchers}/>}
      {voucherEdit && <VoucherModal onClose={()=>setVoucherEdit(null)} initial={voucherEdit} settings={settings} clients={clients} equipment={equipment} offers={offers} setOffers={setOffers} setErr={setErr} flash={flash} setVouchers={setVouchers}/>}
      {voucherTerm && <VoucherTermModal voucher={voucherTerm} onClose={()=>setVoucherTerm(null)} equipment={equipment} clients={clients} settings={settings} setErr={setErr} flash={flash} setVouchers={setVouchers} setOffers={setOffers}/>}
      {extendModal && <ExtendModal offer={extendModal} onClose={()=>setExtendModal(null)} equipment={equipment} settings={settings} packages={packages} clients={clients} vouchers={vouchers} offers={offers} flash={flash} setErr={setErr} onSaved={(patch)=>{ setOffers(p=>p.map(x=>x.id===extendModal.id?{...x,...patch}:x)); setExtendModal(null); }}/>}
    </div>
  );
}

function ExtendModal({offer, onClose, equipment, settings, packages, clients, vouchers, offers, flash, setErr, onSaved}){
  const o = offer;
  const eq = equipment.find(e=>e.id===o.equipment_id) || {};
  const cli = clients.find(c=>c.phone===o.phone);
  const oldStart = new Date(o.year, o.month, o.day);
  const oldEnd = new Date(o.year, o.month, o.day + (+o.days || +o.qty || 1));
  const oldEndStr = `${oldEnd.getFullYear()}-${String(oldEnd.getMonth()+1).padStart(2,'0')}-${String(oldEnd.getDate()).padStart(2,'0')}`;
  const suggestEnd = new Date(oldEnd.getTime() + 86400000);
  const suggestStr = `${suggestEnd.getFullYear()}-${String(suggestEnd.getMonth()+1).padStart(2,'0')}-${String(suggestEnd.getDate()).padStart(2,'0')}`;

  const [newEndStr, setNewEndStr] = useState(suggestStr);
  // Wyliczenia bazowe (przed edycją)
  const [y,m,d] = newEndStr.split('-').map(Number);
  const newEnd = (y&&m&&d) ? new Date(y, m-1, d) : oldEnd;
  const newDays = Math.max(1, Math.round((newEnd - oldStart)/86400000));
  const oldDays = +o.days || +o.qty || 1;
  const extraDays = Math.max(0, newDays - oldDays);
  // Auto-detekcja trybu dla nowego zakresu (do podpowiedzi)
  const sd = oldStart.getDay(), ed = newEnd.getDay();
  const isWknd = sd===5 && (ed===6||ed===0||ed===1) && newDays>=2 && newDays<=3;
  const suggestedMode = (o.mode==='hour'||o.mode==='week') ? o.mode : (isWknd ? 'weekend' : 'day');

  // Wyliczenia auto: stara kwota, nowa kwota
  const oldCalc = computeCalc(o, equipment, settings, packages, clients, vouchers);
  const newCalcAuto = computeCalc({...o, days:newDays, qty:newDays, mode:suggestedMode}, equipment, settings, packages, clients, vouchers);

  // Podpowiedziana dopłata za dodatkowe dni (proste liczenie: extra_day_rate × liczba dodatkowych dób)
  const rateExtra = +eq.rate_extra_day || +eq.rate_day || 0;
  const suggestedExtraRental = extraDays * rateExtra;

  // Edytowalne pola: extraRental jest "sterowane" — puste = użyj podpowiedzi (przelicza się z datą),
  // wpisana wartość = nadpisanie użytkownika (zostaje bez zmian przy zmianie daty)
  const [extraRentalOverride, setExtraRentalOverride] = useState("");
  const [extraTransport, setExtraTransport] = useState(0);
  const [extraAddons, setExtraAddons] = useState(0);
  const [extraNote, setExtraNote] = useState("");

  const isOverridden = extraRentalOverride !== "" && extraRentalOverride !== null;
  const extraRental = isOverridden ? +extraRentalOverride : suggestedExtraRental;
  const totalExtra = (+extraRental||0) + (+extraTransport||0) + (+extraAddons||0);

  // Konflikt z inną rezerwacją?
  const conflict = offers.find(x => x.id !== o.id && x.status !== 'draft' && x.status !== 'done'
    && (x.equipment_id === o.equipment_id || (x.extra_equip_ids||[]).includes(o.equipment_id))
    && (() => { const xs = new Date(x.year, x.month, x.day); const xe = new Date(x.year, x.month, x.day + (+x.days || +x.qty || 1)); return xs < newEnd && xe > oldStart; })());

  const [saving, setSaving] = useState(false);
  const save = async () => {
    if(saving) return;
    console.log("[ExtendModal] Kliknięto Zapisz. Dane:", {newEndStr, newDays, oldDays, extraDays, suggestedMode, totalExtra, extraRental, extraTransport, extraAddons});

    // Walidacje z widocznym feedbackiem
    if(!newEndStr || !/^\d{4}-\d{2}-\d{2}$/.test(newEndStr)){
      alert("⚠ Wpisz poprawną nową datę zwrotu (w formacie: RRRR-MM-DD).");
      return;
    }
    if(isNaN(newDays) || isNaN(extraDays) || extraDays<=0){
      alert(`⚠ Nowa data (${newEndStr}) musi być późniejsza niż obecna data zwrotu.`);
      return;
    }
    if(conflict){
      const cn = clients.find(c=>c.phone===conflict.phone);
      if(!confirm(`⚠️ UWAGA: ten sprzęt jest już zarezerwowany przez ${cn?.name||conflict.phone} w okresie kolidującym z nową datą. Kontynuować mimo to?`)) return;
    }

    setSaving(true);
    try{
      const noteLabel = extraNote ? `Przedłużenie (${extraDays} ${dobaForm(extraDays)}): ${extraNote}` : `Przedłużenie o ${extraDays} ${dobaForm(extraDays)} (do ${newEndStr})`;
      const existingItems = Array.isArray(o.custom_items) ? o.custom_items : [];
      const newCustomItems = [...existingItems];
      if(totalExtra > 0){
        newCustomItems.push({label: noteLabel, price: +totalExtra});
      }
      const patch = {
        days: +newDays,
        qty: +newDays,
        mode: suggestedMode,
        custom_items: newCustomItems
      };
      console.log("[ExtendModal] Wysyłam patch do Supabase:", patch);
      const result = await sbUpdate("gs_offers","id",o.id,patch);
      console.log("[ExtendModal] Odpowiedź Supabase:", result);
      if(flash) flash(`✓ Przedłużono do ${newEndStr}. Dopłata: ${fmt(totalExtra)}`);
      if(onSaved) onSaved(patch);
    }catch(ex){
      const msg = String(ex.message||ex);
      console.error("[ExtendModal] Błąd zapisu:", ex);
      if(setErr) setErr(msg);
      alert("❌ Nie udało się zapisać przedłużenia.\n\nSzczegóły: " + msg);
      setSaving(false);
    }
  };

  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <button className="close-x" onClick={onClose}>×</button>
        <h2>➕ Przedłużenie wynajmu</h2>
        <div className="muted" style={{fontSize:13,marginBottom:14}}>
          <b>{eq.name||'—'}</b> · {cli?.name||o.name||o.phone}<br/>
          Obecny termin: {oldStart.getDate()}.{oldStart.getMonth()+1}.{oldStart.getFullYear()} → <b>{oldEnd.getDate()}.{oldEnd.getMonth()+1}.{oldEnd.getFullYear()}</b> ({oldDays} {dobaForm(oldDays)})
        </div>

        <div className="field">
          <label>Nowa data zwrotu</label>
          <input type="date" value={newEndStr} onChange={e=>setNewEndStr(e.target.value)}/>
          {extraDays>0 && <div style={{fontSize:12,color:"var(--green-d)",marginTop:4}}>✓ Przedłużenie o <b>{extraDays} {dobaForm(extraDays)}</b> · nowy łączny okres: <b>{newDays} {dobaForm(newDays)}</b></div>}
          {extraDays<=0 && <div style={{fontSize:12,color:"#b3261e",marginTop:4}}>⚠ Nowa data musi być późniejsza niż {oldEnd.getDate()}.{oldEnd.getMonth()+1}.{oldEnd.getFullYear()}</div>}
        </div>

        {conflict && <div className="banner err" style={{fontSize:12.5,marginBottom:10}}>
          ⚠️ Ten sprzęt jest już zarezerwowany przez <b>{clients.find(c=>c.phone===conflict.phone)?.name||conflict.phone}</b> w okresie kolidującym z nową datą — mimo to można kontynuować, ale sprawdź kalendarz.
        </div>}

        <div className="card" style={{background:"#f7f5ee",marginBottom:14,padding:14}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:.4,marginBottom:10}}>💰 Dopłata za przedłużenie (każdą pozycję możesz zmienić)</div>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:8}}>
            <span style={{fontSize:13}}>Wynajem (dodatkowe {extraDays} {dobaForm(extraDays)})</span>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <input type="number" value={isOverridden ? extraRentalOverride : suggestedExtraRental} onChange={e=>setExtraRentalOverride(e.target.value)} style={{width:90,padding:"4px 8px",textAlign:"right",border:isOverridden?"1px solid var(--gold)":"1px solid var(--line)",borderRadius:6,background:isOverridden?"#fff8e1":"#fff"}}/>
              <span style={{fontSize:12,color:"var(--muted)"}}>zł</span>
            </div>
          </div>
          <div style={{fontSize:11,color:"var(--muted)",marginBottom:10,marginTop:-4,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span>{isOverridden ? "✏️ Kwota nadpisana ręcznie" : `Auto: ${extraDays} × ${fmt(rateExtra)}/doba = ${fmt(suggestedExtraRental)}`}</span>
            {isOverridden && <span style={{color:"var(--green-d)",cursor:"pointer",fontWeight:600}} onClick={()=>setExtraRentalOverride("")}>↻ Przelicz auto</span>}
          </div>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:10}}>
            <span style={{fontSize:13}}>Dodatkowy transport</span>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <input type="number" value={extraTransport} onChange={e=>setExtraTransport(e.target.value)} style={{width:90,padding:"4px 8px",textAlign:"right",border:"1px solid var(--line)",borderRadius:6}} placeholder="0"/>
              <span style={{fontSize:12,color:"var(--muted)"}}>zł</span>
            </div>
          </div>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:10}}>
            <span style={{fontSize:13}}>Dodatki (np. drewno, prąd)</span>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <input type="number" value={extraAddons} onChange={e=>setExtraAddons(e.target.value)} style={{width:90,padding:"4px 8px",textAlign:"right",border:"1px solid var(--line)",borderRadius:6}} placeholder="0"/>
              <span style={{fontSize:12,color:"var(--muted)"}}>zł</span>
            </div>
          </div>

          <div className="field" style={{marginTop:4}}>
            <label style={{fontSize:12}}>Notatka do rozliczenia (opcjonalnie)</label>
            <input value={extraNote} onChange={e=>setExtraNote(e.target.value)} placeholder="np. dodatkowy worek drewna, opóźniony odbiór" style={{fontSize:13}}/>
          </div>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:10,borderTop:"1px solid var(--line)",marginTop:6}}>
            <span style={{fontSize:14,fontWeight:700,color:"var(--green-d)"}}>Dopłata razem</span>
            <span style={{fontSize:16,fontWeight:700,color:"var(--green-d)"}}>{fmt(totalExtra)}</span>
          </div>
        </div>

        <div className="card" style={{background:"#fff",marginBottom:14,padding:14,border:"1px solid var(--line)"}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:.4,marginBottom:10}}>📊 Podsumowanie całości</div>
          <div style={{fontSize:11.5,color:"var(--muted)",marginBottom:6,fontWeight:600,letterSpacing:.3}}>PIERWOTNA WYCENA</div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}><span>Wynajem</span><span>{fmt(oldCalc.rental)}</span></div>
          {oldCalc.transport>0 && <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}><span>Transport</span><span>{fmt(oldCalc.transport)}</span></div>}
          {(oldCalc.addonsSum+oldCalc.customSum)>0 && <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}><span>Dodatki</span><span>{fmt(oldCalc.addonsSum+oldCalc.customSum)}</span></div>}
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:8,paddingBottom:6,borderBottom:"1px dashed var(--line)"}}><span style={{color:"var(--muted)"}}>Razem pierwotnie</span><span style={{fontWeight:600}}>{fmt(oldCalc.total - oldCalc.deposit)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:10,color:"var(--green-d)"}}><span>+ Opłata za przedłużenie</span><span style={{fontWeight:600}}>{fmt(totalExtra)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:14,fontWeight:700,paddingTop:8,borderTop:"1px solid var(--line)",marginBottom:6}}><span>Razem bez kaucji</span><span>{fmt(oldCalc.total - oldCalc.deposit + totalExtra)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6,color:"var(--muted)"}}><span>+ Kaucja zwrotna</span><span>{fmt(oldCalc.deposit)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:15,fontWeight:700,color:"var(--green-d)",paddingTop:8,borderTop:"1px solid var(--line)"}}><span>Razem z kaucją</span><span>{fmt(oldCalc.total + totalExtra)}</span></div>
        </div>

        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button type="button" className="btn ghost" onClick={onClose} disabled={saving}>Anuluj</button>
          <button type="button" className="btn primary" onClick={save} disabled={saving||extraDays<=0}>{saving ? "Zapisywanie…" : "Zapisz przedłużenie"}</button>
        </div>
      </div>
    </div>
  );
}

function VoucherModal({onClose,setErr,flash,setVouchers,clients,equipment,offers,setOffers,initial}){
  const today = new Date();
  const endDefault = (y,m,d,days)=>{ const dt=new Date(y,m,d+(days||1)); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; };
  const [f,setF]=useState(initial ? {...initial,
      equipment_id: initial.equipment_id||"",
      date_start: initial.year ? `${initial.year}-${String(initial.month+1).padStart(2,'0')}-${String(initial.day).padStart(2,'0')}` : "",
      date_end: initial.year ? endDefault(initial.year,initial.month,initial.day,initial.days) : "",
      time_start: initial.time_start||"12:00", time_end: initial.time_end||"11:00"
    } : {buyer_phone:"",buyer_name:"",recipient_note:"",value:150,cost:0,agreed_total:0,payment_status:"unpaid",valid_until:new Date(new Date().getFullYear()+1,11,31).toISOString().slice(0,10),equipment_id:"",date_start:"",date_end:"",time_start:"12:00",time_end:"11:00"});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const save = async ()=>{
    if(!f.buyer_phone.trim()){ alert("Podaj telefon kupującego, aby utworzyć voucher."); return; }
    try{
      let termFields = {};
      if(f.date_start){
        const [y,m,d]=f.date_start.split('-').map(Number);
        const [ey,em,ed]=(f.date_end||f.date_start).split('-').map(Number);
        const days = Math.max(1, Math.round((new Date(ey,em-1,ed)-new Date(y,m-1,d))/86400000));
        termFields = { equipment_id:f.equipment_id||null, year:y, month:m-1, day:d, days, time_start:f.time_start, time_end:f.time_end };
      } else { termFields = { equipment_id:f.equipment_id||null }; }
      if(f.id){
        const body = {buyer_phone:f.buyer_phone, buyer_name:f.buyer_name, recipient_note:f.recipient_note, value:f.value, cost:f.cost, agreed_total:f.agreed_total, payment_status:f.payment_status, valid_until:f.valid_until, ...termFields};
        await sbUpdate("gs_vouchers","id",f.id,body);
        setVouchers(p=>p.map(x=>x.id===f.id?{...x,...body}:x));
        if(f.linked_offer_id && termFields.equipment_id){
          const offerPatch = { equipment_id:termFields.equipment_id, year:termFields.year, month:termFields.month, day:termFields.day, days:termFields.days, delivery_time:termFields.time_start, pickup_time:termFields.time_end };
          await sbUpdate("gs_offers","id",f.linked_offer_id,offerPatch);
          setOffers && setOffers(p=>p.map(x=>x.id===f.linked_offer_id?{...x,...offerPatch}:x));
        }
        flash("Zapisano zmiany w voucherze."); onClose(); return;
      }
      const code = "GSGIFT"+String(Date.now()).slice(-4);
      const ins = await sbInsert("gs_vouchers",{code, buyer_phone:f.buyer_phone, buyer_name:f.buyer_name, recipient_note:f.recipient_note, value:f.value, cost:f.cost, agreed_total:f.agreed_total||0, payment_status:f.payment_status||"unpaid", valid_until:f.valid_until, redeemed:false, ...termFields});
      setVouchers(p=>[ins[0],...p]); flash("Utworzono voucher "+code); onClose();
    }catch(ex){ setErr(String(ex.message||ex)); }
  };
  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <button className="close-x" onClick={onClose}>×</button>
        <h2>🎁 {f.id?`Edytuj voucher ${f.code}`:"Voucher podarunkowy"}</h2>
        <div className="row2">
          <div className="field"><label>Telefon kupującego</label><input list="dl-v-phones" value={f.buyer_phone} onChange={e=>{const v=e.target.value; set("buyer_phone",v); const c=clients.find(x=>x.phone===v); if(c) setF(p=>({...p,buyer_phone:v,buyer_name:c.name||p.buyer_name}));}} placeholder="600 111 222"/>
            <datalist id="dl-v-phones">{clients.map(c=><option key={c.id} value={c.phone}>{c.name}</option>)}</datalist>
          </div>
          <div className="field"><label>Imię kupującego (opcjonalne)</label><input list="dl-v-names" value={f.buyer_name} onChange={e=>{const v=e.target.value; set("buyer_name",v); const c=clients.find(x=>x.name===v); if(c) setF(p=>({...p,buyer_name:v,buyer_phone:c.phone||p.buyer_phone}));}}/>
            <datalist id="dl-v-names">{clients.filter(c=>c.name).map(c=><option key={c.id} value={c.name}>{c.phone}</option>)}</datalist>
          </div>
        </div>
        <div className="field"><label>Dla kogo / okazja (notatka)</label><input value={f.recipient_note} onChange={e=>set("recipient_note",e.target.value)} placeholder="np. na urodziny córki"/></div>
        <div className="row2">
          <div className="field"><label>Kwota vouchera (zł)</label><input type="number" value={f.value} onChange={e=>set("value",+e.target.value||0)}/></div>
          <div className="field"><label>Ważny do</label><input type="date" value={f.valid_until} onChange={e=>set("valid_until",e.target.value)}/></div>
        </div>
        <div className="row2">
          <div className="field"><label>Uzgodniona łączna kwota najmu (zł, bez kaucji)</label>
            <div className="muted" style={{fontSize:11,marginBottom:4}}>Wypełnij po ustaleniu z klientem — może być wyższa niż wartość vouchera</div>
            <input type="number" value={f.agreed_total||0} onChange={e=>set("agreed_total",+e.target.value||0)}/></div>
          <div className="field"><label>Status płatności</label>
            <select value={f.payment_status||"unpaid"} onChange={e=>set("payment_status",e.target.value)}>
              <option value="unpaid">Nieopłacony</option><option value="deposit">Zadatek wpłacony</option><option value="paid_full">Opłacony w całości</option>
            </select>
          </div>
        </div>
        <div className="field"><label>Koszt własny wystawienia (zł) — do marży</label>
          <div className="muted" style={{fontSize:11,marginBottom:4}}>np. jeśli voucher sprzedany taniej niż realna wartość usługi</div>
          <input type="number" value={f.cost} onChange={e=>set("cost",+e.target.value||0)}/></div>
        <div className="field"><label>Sprzęt</label>
          <select value={f.equipment_id||""} onChange={e=>set("equipment_id",e.target.value)}>
            <option value="">Do ustalenia</option>
            {(equipment||[]).map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
          </select>
        </div>
        <div className="row2">
          <div className="field"><label>Termin od</label><input type="date" value={f.date_start||""} onChange={e=>set("date_start",e.target.value)}/></div>
          <div className="field"><label>Godz. dostawy</label><input type="time" value={f.time_start} onChange={e=>set("time_start",e.target.value)}/></div>
        </div>
        <div className="row2">
          <div className="field"><label>Termin do</label><input type="date" value={f.date_end||""} onChange={e=>set("date_end",e.target.value)}/></div>
          <div className="field"><label>Godz. odbioru</label><input type="time" value={f.time_end} onChange={e=>set("time_end",e.target.value)}/></div>
        </div>
        <div className="modal-actions"><button className="btn primary" onClick={save}>{f.id?"Zapisz zmiany":"Utwórz voucher"}</button></div>
      </div>
    </div>
  );
}

function VoucherTermModal({voucher,onClose,equipment,clients,settings,setErr,flash,setVouchers,setOffers}){
  const today = new Date();
  const buyer = clients.find(c=>c.phone===voucher.buyer_phone);
  const toISO = (y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const startISO = toISO(today.getFullYear(),today.getMonth(),today.getDate());
  const endDefault = new Date(today); endDefault.setDate(endDefault.getDate()+1);
  const [f,setF]=useState({equipment_id:voucher.equipment_id||(equipment[0]?equipment[0].id:""), date_start:startISO, date_end:toISO(endDefault.getFullYear(),endDefault.getMonth(),endDefault.getDate()),
    time_start:"12:00", time_end:"11:00", delivery_address:(buyer&&buyer.address)||""});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const save = async ()=>{
    if(!f.equipment_id){ alert("Wybierz sprzęt."); return; }
    const [y,m,d]=f.date_start.split('-').map(Number);
    const [ey,em,ed]=f.date_end.split('-').map(Number);
    const days = Math.max(1, Math.round((new Date(ey,em-1,ed)-new Date(y,m-1,d))/86400000));
    try{
      const offerBody = { phone:voucher.buyer_phone, name:(buyer&&buyer.name)||voucher.buyer_name||"", equipment_id:f.equipment_id, mode:"day", qty:days, km:0,
        addon_ids:[], extra_equip_ids:[], custom_items:[], rate_override: Math.round((voucher.agreed_total||voucher.value||0)/days),
        transport_override:0, zadatek_override:0, deposit_override:null, voucher_code:voucher.code, offer_cost:0,
        year:y, month:m-1, day:d, days, delivery_address:f.delivery_address, delivery_time:f.time_start, pickup_time:f.time_end, status:"accepted", zadatek_paid:true };
      const ins = await sbInsert("gs_offers",offerBody);
      setOffers(p=>[ins[0],...p]);
      await sbUpdate("gs_vouchers","id",voucher.id,{linked_offer_id:ins[0].id, equipment_id:f.equipment_id, year:y, month:m-1, day:d, days, time_start:f.time_start, time_end:f.time_end});
      setVouchers(p=>p.map(x=>x.id===voucher.id?{...x,linked_offer_id:ins[0].id, equipment_id:f.equipment_id, year:y, month:m-1, day:d, days}:x));
      flash("Ustalono termin realizacji vouchera — wpisano do kalendarza."); onClose();
    }catch(ex){ setErr(String(ex.message||ex)); }
  };
  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <button className="close-x" onClick={onClose}>×</button>
        <h2>📅 Ustal termin realizacji — {voucher.code}</h2>
        <div className="field"><label>Sprzęt</label>

            {equipment.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
          </select>
        </div>
        <div className="row2">
          <div className="field"><label>Termin od</label><input type="date" value={f.date_start} onChange={e=>set("date_start",e.target.value)}/></div>
          <div className="field"><label>Godz. dostawy</label><input type="time" value={f.time_start} onChange={e=>set("time_start",e.target.value)}/></div>
        </div>
        <div className="row2">
          <div className="field"><label>Termin do</label><input type="date" value={f.date_end} onChange={e=>set("date_end",e.target.value)}/></div>
          <div className="field"><label>Godz. odbioru</label><input type="time" value={f.time_end} onChange={e=>set("time_end",e.target.value)}/></div>
        </div>
        <div className="field"><label>Adres dostawy</label><input value={f.delivery_address} onChange={e=>set("delivery_address",e.target.value)}/></div>
        <div className="muted" style={{fontSize:12}}>Wpis pojawi się w kalendarzu i w ofertach oznaczony 🎁. Kaucja rozliczana standardowo jak przy zwykłym wynajmie.</div>
        <div className="modal-actions"><button className="btn primary" onClick={save}>Zapisz termin</button></div>
      </div>
    </div>
  );
}

/* ================= OPINIE ================= */
function ReviewModal({onClose,client,clients,offers,equipment,packages,vouchers,settings,setReviews,flash,setErr}){
  const [phone,setPhone]=useState(client?client.phone:"");
  const sel = (clients||[]).find(c=>c.phone===phone) || client;
  const clientOptions = React.useMemo(()=>{
    const lastAt={}; (offers||[]).filter(o=>o.status!=="draft").forEach(o=>{ const n=o.year*10000+o.month*100+o.day; if(!lastAt[o.phone]||n>lastAt[o.phone]) lastAt[o.phone]=n; });
    return [...(clients||[])].sort((a,b)=>(lastAt[b.phone]||0)-(lastAt[a.phone]||0) || String(a.name||"").localeCompare(String(b.name||"")));
  },[clients,offers]);
  const lastOffer = sel ? offers.filter(o=>o.phone===sel.phone && o.status!=="draft").sort((a,b)=>(b.year*10000+b.month*100+b.day)-(a.year*10000+a.month*100+a.day))[0] : null;
  const eq = lastOffer && equipment.find(e=>e.id===lastOffer.equipment_id);
  const addonNames = lastOffer ? (lastOffer.addon_ids||[]).map(id=>packages.find(p=>p.id===id)).filter(p=>p&&+p.price>0).map(p=>p.name) : [];
  const voucherUsed = sel ? vouchers.some(v=>v.redeemed && v.buyer_phone===sel.phone) : false;
  const [text,setText]=useState("");
  useEffect(()=>{ setText(`Dzień dobry${sel&&sel.name?" "+sel.name.split(" ")[0]:""}! Dziękujemy za skorzystanie z GardenSpa${eq?" po wynajmie "+eq.name.toLowerCase():""}${sel&&sel.city?" w "+sel.city:""} 🌿 Masz 5 sekund? Odpisz nam oceną 1-5 ⭐ i jednym zdaniem, co Ci się podobało — to dla nas naprawdę dużo znaczy!`); },[phone, eq&&eq.id]);
  const [stars,setStars]=useState(5);
  const [reviewText,setReviewText]=useState("");
  const drafts = useMemo(()=>reviewDraftOptions(sel&&sel.name, sel&&sel.city, eq&&eq.name, eq&&eq.type, addonNames, voucherUsed),[phone, eq&&eq.id]);

  const send = kind => { const url = kind==="wa" ? `https://wa.me/${waPhone(phone)}?text=${encodeURIComponent(text)}` : `sms:${phone.replace(/\s/g,"")}?body=${encodeURIComponent(text)}`; window.open(url,"_blank"); };
  const save = async ()=>{
    if(!reviewText){ onClose(); return; }
    try{ const ins = await sbInsert("gs_reviews",{phone, name:(sel&&sel.name)||"", stars, text:reviewText, web:false, fb:false, ig:false});
      setReviews(p=>[ins[0],...p]); flash("Zapisano opinię."); onClose(); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };

  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <button className="close-x" onClick={onClose}>×</button>
        <h2>Poproś o opinię</h2>
        <div className="field"><label>Klient</label>
          <select value={(clients||[]).some(c=>c.phone===phone)?phone:""} onChange={e=>setPhone(e.target.value)}>
            <option value="">— wybierz klienta —</option>
            {clientOptions.map(c=>(<option key={c.id} value={c.phone}>{displayName(c.phone,c.name)}{cityOnly(c.city)?" · "+cityOnly(c.city):""}</option>))}
          </select>
        </div>
        <div className="field"><label>Telefon</label><input value={phone} onChange={e=>setPhone(e.target.value)}/></div>
        <div className="field"><label>Treść wiadomości</label><textarea value={text} onChange={e=>setText(e.target.value)}/></div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <button className="btn primary" onClick={()=>send("wa")}>🟢 WhatsApp</button>
          <button className="btn ghost" onClick={()=>send("sms")}>💬 SMS</button>
        </div>
        <hr style={{border:"none",borderTop:"1px dashed var(--line)",margin:"14px 0"}}/>
        {!sel || !eq ? (
          <div className="muted" style={{fontSize:12.5,marginBottom:8}}>Wybierz klienta powyżej, żeby zobaczyć gotowe szkice opinii dopasowane do jego wynajmu.</div>
        ) : (<>
          <label>Wpisano opinię klienta — wybierz ocenę i szkic (1 dotknięcie, gotowe pod wyszukiwanie)</label>
          {drafts.map((d,i)=>(<div key={i} className="draft" onClick={()=>setReviewText(d)}>{d}</div>))}
        </>)}
        <div style={{display:"flex",gap:6,margin:"8px 0"}}>
          {[1,2,3,4,5].map(n=>(<span key={n} style={{fontSize:20,cursor:"pointer",color:n<=stars?"var(--gold)":"#ddd"}} onClick={()=>setStars(n)}>★</span>))}
        </div>
        <textarea placeholder="Treść opinii klienta…" value={reviewText} onChange={e=>setReviewText(e.target.value)}/>
        <div className="modal-actions"><button className="btn gold" onClick={save}>Zapisz opinię</button></div>
      </div>
    </div>
  );
}

/* ================= RAPORT ================= */
function Raport({offers,equipment,settings,packages,clients,vouchers,costs,goCalendar}){
  const [period,setPeriod]=useState("month");
  const [showRoi,setShowRoi]=useState(false);
  const monthlyCosts = costs.filter(c=>c.period==="monthly").reduce((s,c)=>s+(+c.amount||0),0);
  const oneOffCosts = costs.filter(c=>c.period==="once").reduce((s,c)=>s+(+c.amount||0),0);
  const totalInvestment = equipment.reduce((s,e)=>s+(+e.purchase_cost||0),0);
  const netOf = (o,calc) => calc.total - calc.deposit - (+o.offer_cost||0);
  const revenueForOffers = (list) => list.reduce((s,o)=>{ const calc = computeCalc(o,equipment,settings,packages,clients,vouchers); return s+netOf(o,calc); },0);
  const realized = offers.filter(o=>o.status==="done"||o.status==="accepted");
  const today = new Date();

  const isSet = o => (o.extra_equip_ids||[]).length>0;
  const setLabel = o => { const ids=[o.equipment_id,...(o.extra_equip_ids||[])]; return ids.map(id=>{const e=equipment.find(x=>x.id===id); return e?e.name:"?";}).sort().join(" + "); };
  const perEquipment = equipment.map(e=>{
    const eqOffers = realized.filter(o=>o.equipment_id===e.id && !isSet(o));
    const revenue = revenueForOffers(eqOffers);
    const roiPct = e.purchase_cost>0 ? Math.round((revenue/e.purchase_cost)*100) : 0;
    return {name:e.name, revenue, count:eqOffers.length, roiPct, purchase_cost:e.purchase_cost||0};
  }).sort((a,b)=>b.revenue-a.revenue);

  const setOffers2 = realized.filter(isSet);
  const setGroups = {};
  setOffers2.forEach(o=>{ const k=setLabel(o); (setGroups[k]=setGroups[k]||[]).push(o); });
  const perSet = Object.keys(setGroups).map(k=>{
    const list=setGroups[k]; const revenue=revenueForOffers(list);
    const invest=[...new Set([list[0].equipment_id,...(list[0].extra_equip_ids||[])])].reduce((s,id)=>{const e=equipment.find(x=>x.id===id); return s+(+(e&&e.purchase_cost)||0);},0);
    return {name:k, revenue, count:list.length, roiPct: invest>0?Math.round((revenue/invest)*100):0, purchase_cost:invest};
  }).sort((a,b)=>b.revenue-a.revenue);
  const setRevenue = revenueForOffers(setOffers2);
  const singleRevenue = revenueForOffers(realized.filter(o=>!isSet(o)));
  const setSharePct = (setRevenue+singleRevenue)>0 ? Math.round(setRevenue/(setRevenue+singleRevenue)*100) : 0;

  const periodKey = o => period==="year" ? `${o.year}` : period==="quarter" ? `${o.year}-Q${Math.floor(o.month/3)+1}` : `${o.year}-${o.month}`;
  const periodLabel = key => { if(period==="year") return key; if(period==="quarter"){ const [y,q]=key.split("-Q"); return `${q} kw. ${y}`; } const [y,m]=key.split("-").map(Number); return `${MONTHS[m]} ${y}`; };
  const byPeriod={}; realized.forEach(o=>{ const k=periodKey(o); (byPeriod[k]=byPeriod[k]||[]).push(o); });
  const keyToYm = key => { if(period==="month"){ const [y,m]=key.split("-").map(Number); return {y,m}; } if(period==="quarter"){ const [y,q]=key.split("-Q"); return {y:+y,m:(+q-1)*3}; } return {y:+key,m:0}; };
  const periodSummary = Object.keys(byPeriod).sort().map(k=>{
    const list=byPeriod[k]; const rev=revenueForOffers(list); const net=rev-monthlyCosts;
    const sets=list.filter(isSet); const setRev=revenueForOffers(sets);
    const planList=list.filter(o=>o.status==="accepted"), doneList=list.filter(o=>o.status==="done");
    const byEq={}; list.forEach(o=>{ const calc=computeCalc(o,equipment,settings,packages,clients,vouchers); const k=isSet(o)?("SET:"+setLabel(o)):o.equipment_id; byEq[k]=(byEq[k]||0)+netOf(o,calc); });
    let bestId=null,bestRev=-1; Object.entries(byEq).forEach(([id,r])=>{ if(r>bestRev){bestRev=r;bestId=id;} });
    const bestName = bestId && bestId.startsWith("SET:") ? "🔗 "+bestId.slice(4) : ((equipment.find(e=>e.id===bestId)||{}).name||"—");
    return {label:periodLabel(k), ym:keyToYm(k), revenue:rev, net, count:list.length, setCount:sets.length, setRev,
      planRev:revenueForOffers(planList), planCount:planList.length, doneRev:revenueForOffers(doneList), doneCount:doneList.length,
      bestName, bestRev:bestRev>0?bestRev:0};
  }).reverse();

  const curKey = periodKey({year:today.getFullYear(),month:today.getMonth()});
  const thisMonthRevenue = revenueForOffers(byPeriod[curKey]||[]);
  const thisMonthNet = thisMonthRevenue - monthlyCosts;
  const marginPct = thisMonthRevenue>0 ? Math.round((thisMonthNet/thisMonthRevenue)*100) : 0;
  const allTimeRevenue = revenueForOffers(realized);
  const allTimeCosts = monthlyCosts*Math.max(1,Object.keys(byPeriod).length||1) + oneOffCosts;
  const allTimeNet = allTimeRevenue - allTimeCosts;
  const roiPct = totalInvestment>0 ? Math.round((allTimeNet/totalInvestment)*100) : 0;

  return (
    <div>
      <div className="topbar"><div><h1>Raport</h1><p>Przychody, koszty, ROI</p></div></div>
      <div className="grid row2" style={{marginBottom:12}}>
        <div className="card stat"><div className="v">{fmt(thisMonthRevenue)}</div><div className="l">Przychód (ten miesiąc)</div></div>
        <div className="card stat"><div className="v" style={{color:"#b3261e"}}>{fmt(monthlyCosts)}</div><div className="l">Koszty (miesięcznie)</div></div>
      </div>
      <div className="grid row2" style={{marginBottom:16}}>
        <div className="card stat"><div className="v" style={{color:thisMonthNet>=0?"var(--green-d)":"#b3261e"}}>{fmt(thisMonthNet)}</div><div className="l">Zysk netto (ten miesiąc)</div></div>
        <div className="card stat"><div className="v">{marginPct}%</div><div className="l">Marża</div></div>
      </div>
      {(()=>{
        const curMonthOffers = (byPeriod[curKey]||[]);
        const invoicedList = curMonthOffers.filter(o=>o.invoice_issued);
        const notInvoicedList = curMonthOffers.filter(o=>!o.invoice_issued);
        const invoicedSum = revenueForOffers(invoicedList);
        const notInvoicedSum = revenueForOffers(notInvoicedList);
        const allTimeInvoicedList = realized.filter(o=>o.invoice_issued);
        const allTimeInvoicedSum = revenueForOffers(allTimeInvoicedList);
        return (
        <div className="card" style={{marginBottom:16,padding:14,background:"#f0f7f1",border:"1px solid var(--green)"}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--green-d)",textTransform:"uppercase",letterSpacing:.4,marginBottom:10}}>📄 Faktury</div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}>
            <span>Wystawione w tym miesiącu ({invoicedList.length} z {curMonthOffers.length})</span>
            <span style={{fontWeight:700,color:"var(--green-d)"}}>{fmt(invoicedSum)}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}>
            <span style={{color:notInvoicedList.length>0?"#9a6b00":"var(--muted)"}}>Do wystawienia (ten miesiąc) — {notInvoicedList.length}</span>
            <span style={{fontWeight:600,color:notInvoicedList.length>0?"#9a6b00":"var(--muted)"}}>{fmt(notInvoicedSum)}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--muted)",paddingTop:8,borderTop:"1px dashed #cfe0d1",marginTop:6}}>
            <span>Łącznie wystawione od początku ({allTimeInvoicedList.length} szt.)</span>
            <span style={{fontWeight:600}}>{fmt(allTimeInvoicedSum)}</span>
          </div>
        </div>);
      })()}
      <h3 style={{fontSize:12,color:"var(--muted)",textTransform:"uppercase",marginBottom:8}}>ROI — zwrot z inwestycji w sprzęt</h3>
      <div className="card" style={{marginBottom:10}}>
        <div className="calc-line"><span>Inwestycja w sprzęt (łącznie)</span><span>{fmt(totalInvestment)}</span></div>
        <div className="calc-line"><span>Przychód od początku</span><span>{fmt(allTimeRevenue)}</span></div>
        <div className="calc-line"><span>Zysk netto od początku</span><span>{fmt(allTimeNet)}</span></div>
        <div className="calc-total"><span>ROI</span><span>{roiPct}%</span></div>
      </div>
      <button className="btn ghost sm" style={{marginBottom:12}} onClick={()=>setShowRoi(v=>!v)}>{showRoi?"▾ Ukryj podział na sprzęt":"▸ Pokaż ROI per sprzęt"}</button>
      {showRoi && <>
        {perEquipment.map((e,i)=>(<div key={i} className="card" style={{marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,color:"var(--green-d)"}}><span>{e.name}</span><span>{e.roiPct}%</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--muted)",marginTop:3}}><span>Przychód: {fmt(e.revenue)} · {e.count} zlec.</span><span>Inwestycja: {fmt(e.purchase_cost)}</span></div>
        </div>))}
        {perSet.length>0 && <>
          <h4 style={{fontSize:11.5,color:"var(--muted)",textTransform:"uppercase",margin:"12px 0 6px"}}>🔗 Zestawy</h4>
          {perSet.map((s,i)=>(<div key={i} className="card" style={{marginBottom:8,borderLeft:"3px solid var(--gold)"}}>
            <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,color:"var(--green-d)"}}><span>{s.name}</span><span>{s.roiPct}%</span></div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--muted)",marginTop:3}}><span>Przychód: {fmt(s.revenue)} · {s.count} zlec.</span><span>Inwestycja: {fmt(s.purchase_cost)}</span></div>
          </div>))}
        </>}
      </>}
      <div className="card" style={{marginBottom:8,background:"#faf9f5"}}>
        <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,color:"var(--green-d)",marginBottom:4}}><span>🔗 Zestawy vs pojedynczy sprzęt</span><span>{setSharePct}%</span></div>
        <div className="calc-line"><span>Zestawy ({setOffers2.length} zlec.)</span><span>{fmt(setRevenue)}</span></div>
        <div className="calc-line"><span>Pojedynczy sprzęt ({realized.length-setOffers2.length} zlec.)</span><span>{fmt(singleRevenue)}</span></div>
        <div style={{height:8,borderRadius:4,background:"var(--line)",overflow:"hidden",marginTop:6}}><div style={{width:setSharePct+"%",height:"100%",background:"var(--gold)"}}/></div>
        <div className="muted" style={{fontSize:11,marginTop:4}}>Udział zestawów w przychodzie</div>
      </div>
      <h3 style={{fontSize:12,color:"var(--muted)",textTransform:"uppercase",margin:"18px 0 8px"}}>Podsumowanie okresowe</h3>
      <div style={{display:"flex",gap:6,marginBottom:10}}>
        {["month","quarter","year"].map(p=>(<button key={p} className={"btn sm "+(period===p?"primary":"ghost")} onClick={()=>setPeriod(p)}>{p==="month"?"Miesiąc":p==="quarter"?"Kwartał":"Rok"}</button>))}
      </div>
      {periodSummary.length===0 && <div className="empty">Brak zrealizowanych/zaakceptowanych zleceń do podsumowania.</div>}
      {periodSummary.map((m,i)=>(<div key={i} className="card" style={{marginBottom:8,cursor:"pointer"}} onClick={()=>goCalendar&&goCalendar(m.ym.y,m.ym.m)}>
        <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,color:"var(--green-d)"}}><span>{m.label} <span style={{fontSize:11,fontWeight:400,color:"var(--muted)"}}>→ kalendarz</span></span><span className="muted" style={{fontWeight:400}}>{m.count} zlec.{m.setCount?` · 🔗 ${m.setCount}`:""}</span></div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginTop:3}}><span className="muted">Przychód: {fmt(m.revenue)}</span><span style={{color:m.net>=0?"var(--green-d)":"#b3261e",fontWeight:700}}>Netto: {fmt(m.net)}</span></div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11.5,marginTop:4,paddingTop:4,borderTop:"1px solid var(--line)"}}>
          <span style={{color:"#3b6fd6"}}>📅 Plan: {fmt(m.planRev)} ({m.planCount})</span>
          <span style={{color:"var(--green-d)"}}>✅ Zrealizowane: {fmt(m.doneRev)} ({m.doneCount})</span>
        </div>
        {m.setCount>0 && <div style={{fontSize:11,color:"#9a6b00",marginTop:3}}>🔗 Zestawy: {m.setCount} · {fmt(m.setRev)}</div>}
        {m.bestRev>0 && <div style={{fontSize:11,color:"#9a6b00",marginTop:3}}>🏆 Najlepszy: {m.bestName} ({fmt(m.bestRev)})</div>}
      </div>))}
      <div className="muted" style={{fontSize:11,marginTop:10}}>Koszty edytujesz w Ustawienia → Koszty stałe. Koszt zakupu sprzętu edytujesz przy każdej pozycji w Ustawienia → Sprzęt.</div>
      <h3 style={{fontSize:12,color:"var(--muted)",textTransform:"uppercase",margin:"18px 0 8px"}}>Polecenia i promocje</h3>
      <div className="grid row2" style={{marginBottom:10}}>
        <div className="card stat"><div className="v">{clients.filter(c=>c.referral_status==="used").length}</div><div className="l">Klientów, którzy wykorzystali rabat z polecenia</div></div>
        <div className="card stat"><div className="v">{clients.filter(c=>(c.referral_pct_pending>0||c.referral_discount_value>0)&&c.referral_status!=="used").length}</div><div className="l">Aktywnych, niewykorzystanych rabatów</div></div>
      </div>
      <div className="card stat" style={{marginBottom:10}}><div className="v">{vouchers.filter(v=>v.redeemed).length} / {vouchers.length}</div><div className="l">Voucherów wykorzystanych / wystawionych</div></div>
    </div>
  );
}

/* ================= USTAWIENIA ================= */
function Ustawienia({settings,setSettings,equipment,setEquipment,packages,setPackages,tiers,setTiers,costs,setCosts,flash,setErr,reload}){
  const [mod,setMod]=useState(null);
  const saveSettings = async (patch) => {
    try{ await sbUpdate("gs_settings","id",1,patch); setSettings(p=>({...p,...patch})); flash("Zapisano ustawienia."); }
    catch(ex){ setErr(String(ex.message||ex)); }
  };

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = {hasError:false, error:null}; }
  static getDerivedStateFromError(error){ return {hasError:true, error}; }
  componentDidCatch(error, info){ console.error("[ErrorBoundary] Aplikacja się wywaliła:", error, info); }
  render(){
    if(this.state.hasError){
      const msg = String(this.state.error && (this.state.error.message||this.state.error) || "nieznany błąd");
      return (
        <div style={{padding:"24px 16px",maxWidth:520,margin:"40px auto",fontFamily:"system-ui,-apple-system,sans-serif"}}>
          <div style={{background:"#fdecea",border:"1px solid #f5b3ab",borderRadius:10,padding:18}}>
            <div style={{fontSize:22,marginBottom:8}}>⚠️</div>
            <h2 style={{margin:"0 0 8px",color:"#8a2818",fontSize:18}}>Coś poszło nie tak</h2>
            <p style={{margin:"0 0 12px",color:"#5c1a10",fontSize:14,lineHeight:1.5}}>Aplikacja natrafiła na problem i musiała się zatrzymać. Najczęściej pomaga odświeżenie strony.</p>
            <details style={{marginBottom:14,fontSize:12,color:"#7a2a1a"}}>
              <summary style={{cursor:"pointer",fontWeight:600,marginBottom:6}}>Szczegóły techniczne</summary>
              <div style={{background:"#fff",padding:8,borderRadius:6,marginTop:6,fontFamily:"monospace",fontSize:11,wordBreak:"break-word"}}>{msg}</div>
            </details>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button onClick={()=>window.location.reload()} style={{background:"#153826",color:"#fff",border:"none",padding:"10px 16px",borderRadius:6,fontSize:14,fontWeight:600,cursor:"pointer"}}>🔄 Odśwież stronę</button>
              <button onClick={()=>{this.setState({hasError:false,error:null});}} style={{background:"#fff",color:"#153826",border:"1px solid #153826",padding:"10px 16px",borderRadius:6,fontSize:14,fontWeight:600,cursor:"pointer"}}>↩ Spróbuj ponownie</button>
            </div>
            <p style={{margin:"14px 0 0",fontSize:11,color:"#7a5545",lineHeight:1.4}}>Jeśli błąd wraca — zrób zrzut ekranu tej strony (razem ze szczegółami technicznymi) i wyślij do wsparcia.</p>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
} catch(ex) {
  document.getElementById("root").innerHTML = '<div style="padding:24px;font-family:sans-serif;max-width:520px;margin:40px auto;background:#fdecea;border:1px solid #f5b3ab;border-radius:10px;color:#5c1a10"><h2 style="margin:0 0 8px;font-size:18px">⚠️ Aplikacja nie mogła się uruchomić</h2><p style="margin:0 0 12px;font-size:14px">'+String(ex.message||ex)+'</p><button onclick="window.location.reload()" style="background:#153826;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-size:14px;font-weight:600">🔄 Odśwież stronę</button></div>';
}
